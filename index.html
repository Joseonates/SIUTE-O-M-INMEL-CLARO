<style>
  :root{
    --claro-red:#E30613; --claro-red-dark:#a30410; --ink:#1c1f26; --paper:#f6f5f2;
    --panel:#ffffff; --line:#e2e0da; --muted:#6b7076; --good:#1e8a4c; --bad:#c8102e;

  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);}
  #app{max-width:1000px;margin:0 auto;padding:18px 16px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--claro-red);padding-bottom:10px;margin-bottom:16px;flex-wrap:wrap;gap:8px;}

  .brand .mark{width:34px;height:34px;border-radius:6px;background:var(--claro-red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;}
  .brand .title{font-weight:800;font-size:15px;letter-spacing:.02em;}
  .brand .sub{font-size:11px;color:var(--muted);font-family:var(--mono);}
  .nav{display:flex;gap:6px;flex-wrap:wrap;}
  .nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 11px;border-radius:7px;font-size:12.5px;cursor:pointer;font-weight:600;}
  .nav button.active{background:var(--claro-red);color:#fff;border-color:var(--claro-red);}
  .nav button:hover{border-color:var(--claro-red);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
  .card h2{font-size:14px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.06em;color:var(--claro-red-dark);border-bottom:2px solid var(--line);padding-bottom:8px;}
  .card h3{font-size:13px;margin:0 0 10px;}
  .hint{font-size:11.5px;color:var(--muted);margin:-6px 0 12px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:var(--sans);background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:60px;}
  .field{margin-bottom:8px;}
  .btn{border:none;background:var(--claro-red);color:#fff;padding:10px 16px;border-radius:7px;font-weight:700;font-size:13.5px;cursor:pointer;}
  .btn:hover{background:var(--claro-red-dark);}
  .btn.secondary{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
  .btn.secondary:hover{border-color:var(--claro-red);}
  .btn.ghost{background:transparent;color:var(--claro-red-dark);border:1px dashed var(--line);}
  .btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad);}
  .btn.danger:hover{background:var(--bad);color:#fff;}
  .btn.small{padding:5px 9px;font-size:11.5px;border-radius:6px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
  .home-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;cursor:pointer;transition:.15s;}
  .home-card:hover{border-color:var(--claro-red);transform:translateY(-2px);}
  .home-card .icon{font-size:24px;margin-bottom:8px;}
  .home-card h3{margin:0 0 4px;font-size:15px;}
  .home-card p{margin:0;font-size:12.5px;color:var(--muted);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{background:#faf9f7;text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.03em;}
  td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  .status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .status-pill.en_progreso{background:#fff4e0;color:var(--amber);}
  .status-pill.finalizado{background:#e5f6ea;color:var(--good);}
  .loc-panel{background:#f9f8f5;border:1px dashed var(--line);border-radius:8px;padding:12px;}
  .loc-panel .loc-log{max-height:150px;overflow:auto;font-family:var(--mono);font-size:11.5px;margin-top:8px;}

  .manual-loc{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:end;}

  .hist-list{display:flex;flex-direction:column;gap:8px;}
  .hist-row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);gap:10px;flex-wrap:wrap;}
  .hist-row:hover{border-color:var(--claro-red);}
  .hist-row .main{cursor:pointer;flex:1;min-width:160px;}
  .hist-row .id{font-family:var(--mono);font-weight:700;font-size:12.5px;}
  .hist-row .name{font-size:12.5px;color:var(--muted);}
  .hist-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px;}
  .readonly-note{background:#f1f0eb;color:var(--muted);padding:8px 10px;border-radius:6px;font-size:12px;margin-bottom:10px;}
  .success-card{text-align:center;padding:34px 18px;}
  .success-card .big{font-size:40px;margin-bottom:6px;}
  select[data-val=""]{color:var(--muted);font-style:italic;}

  .photo-box{display:flex;gap:4px;justify-content:center;}
  .photo-btn{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:28px;font-size:13px;cursor:pointer;}
  .photo-btn:hover{border-color:var(--claro-red);}
  .photo-thumb-wrap{position:relative;display:inline-block;}
  .photo-thumb{width:60px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--line);display:block;}
  .photo-del{position:absolute;top:-6px;right:-6px;background:#fff;border:1px solid var(--line);border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;line-height:1;padding:0;}
  .no-photo{color:var(--muted);font-size:10.5px;}
  .foto-col-title{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;text-align:center;}

  .photo-modal-overlay{position:fixed;inset:0;background:rgba(10,10,10,.85);z-index:9999;align-items:center;justify-content:center;padding:20px;display:none;}
  .photo-modal-overlay.show{display:flex;}
  .photo-modal-inner{position:relative;max-width:92vw;max-height:88vh;text-align:center;}
  .photo-modal-inner img{max-width:92vw;max-height:78vh;border-radius:8px;display:block;}
  .photo-modal-caption{color:#fff;font-size:12.5px;margin-top:10px;}
  .photo-modal-close{position:absolute;top:-16px;right:-16px;background:#fff;border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-weight:700;}

  .row-card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff;}
  .row-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .row-card-head .idx{font-family:var(--mono);font-size:11px;color:var(--claro-red-dark);font-weight:700;}
  .row-del{background:none;border:none;color:var(--bad);font-size:12px;font-weight:600;cursor:pointer;}
  .add-row-btn{width:100%;padding:12px;border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--claro-red-dark);font-weight:700;font-size:13px;cursor:pointer;}
  .subhead{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px;}
</style>

<script>
/* ============================================================
   Almacenamiento con sincronización real (Firebase Firestore)
   — reemplaza window.storage.
   VARIANTE CON SINCRONIZACIÓN: los datos que se guardan con
   shared=true (session:*, index-entry:*) quedan en la nube y
   se sincronizan automáticamente entre el celular del técnico
   y el dispositivo del supervisor.

   ⚠️ PASO OBLIGATORIO ANTES DE USAR: reemplaza el objeto
   firebaseConfig de abajo con el de TU proyecto de Firebase.
   Instrucciones completas en INSTRUCCIONES.md.

   Nota técnica: cada valor que se guarda se parte en "chunks"
   de forma automática y transparente para no chocar con el
   límite de 1 MB por documento de Firestore.
   ============================================================ */
(function () {
  const firebaseConfig = {
    apiKey: "PEGA_AQUI_TU_API_KEY",
    authDomain: "PEGA_AQUI_TU_PROYECTO.firebaseapp.com",
    projectId: "PEGA_AQUI_TU_PROYECTO",
    storageBucket: "PEGA_AQUI_TU_PROYECTO.appspot.com",
    messagingSenderId: "000000000000",
    appId: "1:000000000000:web:xxxxxxxxxxxxxxxxxxxxxxxx"
  };

  if (firebaseConfig.apiKey === "PEGA_AQUI_TU_API_KEY") {
    console.warn("⚠️ Falta configurar Firebase: edita firebaseConfig en index.html (ver INSTRUCCIONES.md).");
  }

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const CHUNK_SIZE = 700000;

  function sanitize(key) { return String(key).replace(/[\/.]/g, "_"); }

  const DB_NAME = "emergencias-claro-local-db";
  const STORE = "kv";
  function openLocalDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function localGet(key) {
    const ldb = await openLocalDB();
    return new Promise((resolve, reject) => {
      const tx = ldb.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = () => resolve(req.result !== undefined ? { key, value: req.result } : null);
      req.onerror = () => reject(req.error);
    });
  }
  async function localSet(key, value) {
    const ldb = await openLocalDB();
    return new Promise((resolve, reject) => {
      const tx = ldb.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = () => resolve({ key, value });
      tx.onerror = () => reject(tx.error);
    });
  }
  async function localDelete(key) {
    const ldb = await openLocalDB();
    return new Promise((resolve, reject) => {
      const tx = ldb.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = () => resolve({ key, deleted: true });
      tx.onerror = () => reject(tx.error);
    });
  }

  window.storage = {
    async get(key, shared) {
      if (!shared) return localGet(key);
      const id = sanitize(key);
      const manifestSnap = await db.collection("storage_meta").doc(id).get();
      if (!manifestSnap.exists) return null;
      const chunkSnaps = await db.collection("storage_meta").doc(id).collection("chunks")
        .orderBy(firebase.firestore.FieldPath.documentId()).get();
      let value = "";
      chunkSnaps.forEach((doc) => { value += doc.data().data; });
      return { key, value };
    },
    async set(key, value, shared) {
      if (!shared) return localSet(key, value);
      const id = sanitize(key);
      const chunks = [];
      for (let i = 0; i < value.length; i += CHUNK_SIZE) chunks.push(value.slice(i, i + CHUNK_SIZE));
      const colRef = db.collection("storage_meta").doc(id).collection("chunks");
      const existing = await colRef.get();
      const writes = [];
      chunks.forEach((c, i) => { writes.push(colRef.doc(String(i).padStart(5, "0")).set({ data: c })); });
      existing.forEach((doc) => {
        const idx = parseInt(doc.id, 10);
        if (idx >= chunks.length) writes.push(doc.ref.delete());
      });
      writes.push(db.collection("storage_meta").doc(id).set({ chunkCount: chunks.length, updatedAt: Date.now() }));
      await Promise.all(writes);
      return { key, value };
    },
    async delete(key, shared) {
      if (!shared) return localDelete(key);
      const id = sanitize(key);
      const chunkSnap = await db.collection("storage_meta").doc(id).collection("chunks").get();
      const writes = [];
      chunkSnap.forEach((doc) => writes.push(doc.ref.delete()));
      writes.push(db.collection("storage_meta").doc(id).delete());
      await Promise.all(writes);
      return { key, deleted: true };
    },
    async list(prefix, shared) {
      if (!shared) return { keys: [] };
      const p = sanitize(prefix || "");
      const snap = await db.collection("storage_meta")
        .where(firebase.firestore.FieldPath.documentId(), ">=", p)
        .where(firebase.firestore.FieldPath.documentId(), "<", p + "\uf8ff")
        .get();
      const keys = [];
      snap.forEach((doc) => keys.push(doc.id));
      return { keys };
    },
  };
})();
</script>

<script>
(function(){

const LOC_INTERVAL_MS = 2*60*60*1000;
const PHOTO_MAX_DIM = 480;
const PHOTO_QUALITY = 0.55;

let state = { view:"home", currentSession:null, locTimer:null, liveTimer:null, viewerId:null, viewedSession:null };
(function(){
  try{
    const params = new URLSearchParams(location.search);
    const t = params.get('tipo');
    if(t){ state.pendingTipo = t; state.view = 'nuevo'; }
  }catch(e){}
})();

function uid(){ return 'OT' + Math.floor(1000000+Math.random()*8999999); }
function rid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowIso(){ return new Date().toISOString(); }
function fmt(dt){ if(!dt) return "—"; const d=new Date(dt); return d.toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'}); }
function isMasterAdmin(){ try{ return localStorage.getItem('masterAdmin')==='1'; }catch(e){ return false; } }
function isAdminOnlyMode(){ try{ return localStorage.getItem('adminActive')==='1' && localStorage.getItem('masterAdmin')!=='1'; }catch(e){ return false; } }
function hasAdminAccess(){ return isAdminOnlyMode() || isMasterAdmin(); }

function emptySession(otId){
  return {
    id: otId && otId.trim() ? otId.trim() : uid(),
    createdAt: nowIso(), updatedAt: nowIso(), status: "en_progreso",
    general: {
      nombreEstacion:"", categoria:"", regional:"", responsable:"", departamento:"", noInc:"",
      direccion:"", noTas:"", tipoEstacion:"", fechaEjecucion:nowIso(), tipoSitio:"", fechaFin:"",
      siteOwner:""
    },
    actividad: {
      tipoActividad:"", tipoEquipoFalla:"", subsistema:"", modelo:"",
      afectacionServicios:"", reinstalacion:"", cambio:"", reparacion:""
    },
    descripcionFalla:"", descripcionSolucion:"",
    repuestosRetirados:[], repuestosInstalados:[],
    materiales:[], evidencias:[],
    hallazgoSi:"", hallazgosObservaciones:"", hallazgosFotos:[], hallazgos:[],
    transporte:[],
    fallaResuelta:"", observaciones:"",
    firma:{ejecuta:"",empresa:"INMEL",revisa:"",fechaElaboracion:""},
    ubicaciones:[],
    videos:[]
  };
}
const ROW_TEMPLATES = {
  repuestosRetirados: ()=>({id:rid(),descripcion:"",marca:"",modelo:"",serial:""}),
  repuestosInstalados: ()=>({id:rid(),descripcion:"",marca:"",modelo:"",serial:""}),
  materiales: ()=>({id:rid(),cantidad:"",unidad:"",descripcion:"",fotoAntes:null,fotoDespues:null}),
  evidencias: ()=>({id:rid(),caption:"",foto:null}),
  hallazgos: ()=>({id:rid(),sistema:"",prioridad:"Media",descripcion:"",resuelto:"",foto:null}),
  hallazgosFotos: ()=>({id:rid(),foto:null}),
  transporte: ()=>({id:rid(),distanciaKm:"",tiempo:"",tipo:"",observacion:"",foto:null}),
};

// ---------- STORAGE ----------
async function saveSession(sess){
  sess.updatedAt = nowIso();
  await window.storage.set('emergencias-session:'+sess.id, JSON.stringify(sess), true);
  await updateIndex(sess);
}
async function saveSessionSafe(sess){
  try{ await saveSession(sess); return true; }catch(e){ console.error(e); return false; }
}
async function loadSession(id){
  try{ const r = await window.storage.get('emergencias-session:'+id, true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; }
}
async function updateIndex(sess){
  const summary = {id:sess.id, tipo:'emergencias', nombreEstacion:sess.general.nombreEstacion||"(sin nombre)", status:sess.status, createdAt:sess.createdAt, updatedAt:sess.updatedAt};
  try{ await window.storage.set('emergencias-index-entry:'+sess.id, JSON.stringify(summary), true); }catch(e){ console.error(e); }
}
async function getIndex(){
  try{
    const listing = await window.storage.list('emergencias-index-entry:', true);
    const keys = (listing && listing.keys) || [];
    const entries = await Promise.all(keys.map(async (k)=>{
      try{ const r = await window.storage.get(k, true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; }
    }));
    return entries.filter(Boolean);
  }catch(e){ return []; }
}
async function deleteSessionEverywhere(id){
  try{
    const sess = await loadSession(id);
    if(sess && sess.videos && sess.videos.length){
      for(const v of sess.videos){ await deleteVideoData(id, v.id); }
    }
  }catch(e){}
  try{ await window.storage.delete('emergencias-session:'+id, true); }catch(e){}
  try{ await window.storage.delete('emergencias-index-entry:'+id, true); }catch(e){}
}

// ---------- videos (guardados aparte, no dentro del JSON de la sesión) ----------
const VIDEO_MAX_MB = 20;
async function saveVideoData(sessId, videoId, dataUrl){
  await window.storage.set('emergencias-video-data:'+sessId+':'+videoId, dataUrl, true);
}
async function loadVideoData(sessId, videoId){
  try{ const r = await window.storage.get('emergencias-video-data:'+sessId+':'+videoId, true); return r ? r.value : null; }catch(e){ return null; }
}
async function deleteVideoData(sessId, videoId){
  try{ await window.storage.delete('emergencias-video-data:'+sessId+':'+videoId, true); }catch(e){}
}

// ---------- GEOLOCATION ----------
function captureLocation(sess, tipo){
  if(!navigator.geolocation){
    sess.ubicaciones.push({lat:null,lng:null,timestamp:nowIso(),tipo,error:"Geolocalización no disponible en este navegador"});
    saveSessionSafe(sess); if(state.currentSession===sess) render();
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    sess.ubicaciones.push({lat:pos.coords.latitude,lng:pos.coords.longitude,timestamp:nowIso(),tipo});
    await saveSessionSafe(sess);
    if(state.currentSession===sess) render();
  }, async (err)=>{
    sess.ubicaciones.push({lat:null,lng:null,timestamp:nowIso(),tipo,error:err.message||"Permiso de ubicación denegado"});
    await saveSessionSafe(sess);
    if(state.currentSession===sess) render();
  }, {enableHighAccuracy:true, timeout:15000});
}
function startLocationLoop(sess){
  stopLocationLoop();
  captureLocation(sess,"inicial");
  state.locTimer = setInterval(()=>{
    if(state.currentSession && state.currentSession.status==="en_progreso"){ captureLocation(state.currentSession,"periodica"); }
  }, LOC_INTERVAL_MS);
}
function stopLocationLoop(){ if(state.locTimer){ clearInterval(state.locTimer); state.locTimer=null; } }
function mapLink(lat,lng){ return `https://www.google.com/maps?q=${lat},${lng}`; }

function activeSession(){ return state.view==='viewsession' ? state.viewedSession : state.currentSession; }
function findRow(arrName, rowId){ const s=activeSession(); if(!s) return null; return (s[arrName]||[]).find(r=>r.id===rowId); }

// ---------- photo capture / compression ----------
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>=h){ if(w>PHOTO_MAX_DIM){ h = Math.round(h*PHOTO_MAX_DIM/w); w = PHOTO_MAX_DIM; } }
        else { if(h>PHOTO_MAX_DIM){ w = Math.round(w*PHOTO_MAX_DIM/h); h = PHOTO_MAX_DIM; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', PHOTO_QUALITY));
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}
// photo key format: arrName|rowId|field
function photoCellHtml(key, dataUrl, readonly, label){
  const lbl = label || 'Evidencia';
  if(dataUrl){
    return `<div class="foto-col-title">${lbl}</div><div class="photo-thumb-wrap">
      <img src="${dataUrl}" class="photo-thumb" data-enlarge="${key}">
      ${!readonly?`<button type="button" class="photo-del" data-delphoto="${key}" title="Eliminar foto">✕</button>`:''}
    </div>`;
  }
  if(readonly) return `<div class="foto-col-title">${lbl}</div><span class="no-photo">— sin foto —</span>`;
  return `<div class="foto-col-title">${lbl}</div><div class="photo-box">
    <button type="button" class="photo-btn" data-cam="${key}" title="Tomar foto con la cámara">📷</button>
    <button type="button" class="photo-btn" data-gal="${key}" title="Elegir de galería">🖼️</button>
    <input type="file" accept="image/*" class="photo-input" data-key="${key}" style="display:none;">
  </div>`;
}

// ---------- RENDER ----------
function topbar(activeView){
  return `
  <div class="topbar">
    <div class="brand">
      <div class="mark">C·I</div>
      <div><div class="title">Claro · INMEL — O&amp;M</div><div class="sub">Mant. Correctivo y Emergencias</div></div>
    </div>
    <div class="nav">
      <button data-nav="home" class="${activeView==='home'?'active':''}">Inicio</button>
      <button data-nav="historial" class="${activeView==='historial'?'active':''}">Historial</button>
      ${hasAdminAccess()?`<button data-nav="supervisor" class="${activeView==='supervisor'?'active':''}">Supervisor</button>`:''}
    </div>
  </div>`;
}

async function render(){
  const app = document.getElementById('app');
  if(state.view==="home") app.innerHTML = topbar('home') + renderHome();
  else if(state.view==="nuevo") app.innerHTML = topbar('') + renderNuevo();
  else if(state.view==="historial") app.innerHTML = topbar('historial') + await renderHistorialAsync();
  else if(state.view==="supervisor") app.innerHTML = topbar('supervisor') + await renderSupervisorAsync();
  else if(state.view==="form") app.innerHTML = topbar('') + renderForm(state.currentSession,false);
  else if(state.view==="viewsession") app.innerHTML = topbar('') + renderForm(state.viewedSession,true);
  else if(state.view==="finalizado") app.innerHTML = topbar('') + renderFinalizado();
  attachHandlers();
}

function renderHome(){
  return `
  <div class="home-grid">
    ${isAdminOnlyMode()?`<div class="card" style="grid-column:1/-1;"><p class="hint" style="margin:0;">Como administrador puedes ver el historial y el modo supervisor, pero no crear nuevas atenciones ni borrar formatos.</p></div>`:`
    <div class="home-card" data-nav="nuevo" data-tipo="Emergencia">
      <div class="icon">🚨</div><h3>Nueva Emergencia</h3>
      <p>Ingresa el número de OT y registra la atención de emergencia en campo. Para Correctivos, usa la tarjeta correspondiente en el panel principal.</p>
    </div>`}
    <div class="home-card" data-nav="historial">
      <div class="icon">🗂️</div><h3>Historial</h3>
      <p>Ver o descargar (PDF) los reportes guardados.</p>
    </div>
    ${hasAdminAccess()?`<div class="home-card" data-nav="supervisor">
      <div class="icon">📡</div><h3>Modo supervisor</h3>
      <p>Ver en línea una atención en curso y revisar sus evidencias.</p>
    </div>`:''}
  </div>
  <div class="card" style="margin-top:14px;">
    <h2>Cómo funciona</h2>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.5;margin:0;">
      Cualquier cantidad de técnicos puede atender emergencias en paralelo, en distintos sitios, cada uno con su
      propia OT. El supervisor puede revisar en "Modo supervisor" cualquier atención en curso o finalizada.
    </p>
  </div>`;
}

function renderNuevo(){
  const suggested = uid();
  return `<div class="card">
    <h2>Nueva atención${state.pendingTipo?(' — '+state.pendingTipo):''} — Número de OT</h2>
    <div class="field"><label>Número de Orden de Trabajo (OT)</label>
      <input id="ot-input" placeholder="Ej: OT5309583" value="${suggested}">
    </div>
    <p style="font-size:12px;color:var(--muted);">Puedes dejar el número sugerido o escribir el número real de tu OT.</p>
    <div class="row-actions">
      <button class="btn" id="btn-crear-ot">🚨 Crear e iniciar atención</button>
      <button class="btn ghost" id="btn-volver">← Cancelar</button>
    </div>
  </div>`;
}

async function renderHistorialAsync(){
  const idx = await getIndex();
  if(idx.length===0) return `<div class="card"><div class="empty">Aún no hay reportes guardados.</div></div>`;
  idx.sort((a,b)=> new Date(b.updatedAt)-new Date(a.updatedAt));
  return `<div class="card"><h2>Historial de atenciones</h2>
    <div class="hist-list">
      ${idx.map(s=>`
        <div class="hist-row">
          <div class="main" data-open="${s.id}">
            <div class="id">${s.id}</div>
            <div class="name">${s.nombreEstacion} · actualizado ${fmt(s.updatedAt)}</div>
          </div>
          <span class="status-pill ${s.status}">${s.status==='en_progreso'?'En progreso':'Finalizado'}</span>
          <div class="hist-actions">
            <button class="btn secondary small" data-pdf="${s.id}">⬇️ PDF</button>
            
            ${isMasterAdmin()?`<button class="btn danger small" data-delete="${s.id}">🗑️ Borrar</button>`:''}
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

async function renderSupervisorAsync(){
  const idx = await getIndex();
  const enProgreso = idx.filter(s=>s.status==='en_progreso');
  let html = `<div class="card"><h2>Ver atención en vivo</h2>`;
  if(enProgreso.length===0){ html += `<div class="empty">No hay atenciones en progreso en este momento.</div></div>`; return html; }
  html += `<div class="hist-list">
    ${enProgreso.map(s=>`
      <div class="hist-row">
        <div class="main" data-watch="${s.id}"><div class="id">${s.id}</div><div class="name">${s.nombreEstacion}</div></div>
        <span class="status-pill en_progreso">En progreso</span>
        <div class="hist-actions">
          <button class="btn secondary small" data-pdf="${s.id}">⬇️ PDF</button>
          ${isMasterAdmin()?`<button class="btn danger small" data-delete="${s.id}">🗑️ Borrar</button>`:''}
        </div>
      </div>`).join('')}
  </div></div>`;
  return html;
}

function renderFinalizado(){
  const sess = state.currentSession;
  return `<div class="card success-card">
    <div class="big">✅</div>
    <h2 style="border:none;">Atención guardada</h2>
    <p style="color:var(--muted);">OT <b>${sess.id}</b> quedó registrada como <b>finalizada</b>.</p>
    <div class="row-actions" style="justify-content:center;">
      <button class="btn" id="btn-otro-formato">🚨 Generar otro reporte</button>
      <button class="btn secondary" id="btn-dl-pdf">⬇️ Descargar PDF</button>
      
      <button class="btn ghost" id="btn-ver-historial">🗂️ Ver historial</button>
    </div>
  </div>`;
}

function textField(labelTxt, path, value, readonly){
  return `<div class="field"><label>${labelTxt}</label><input data-field="${path}" value="${(value||'').toString().replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>`;
}
function dateField(labelTxt, path, value, readonly){
  return `<div class="field"><label>${labelTxt}</label><input type="datetime-local" data-field="${path}" data-iso="1" value="${value? new Date(value).toISOString().slice(0,16):''}" ${readonly?'disabled':''}></div>`;
}
function textareaField(labelTxt, path, value, readonly){
  return `<div class="field"><label>${labelTxt}</label><textarea data-field="${path}" ${readonly?'disabled':''}>${value||''}</textarea></div>`;
}
function siNoField(labelTxt, path, value, readonly){
  return `<div class="field"><label>${labelTxt}</label><select data-field="${path}" ${readonly?'disabled':''}>
    <option value="" ${value===''?'selected':''}>Seleccione</option>
    <option value="SI" ${value==='SI'?'selected':''}>SÍ</option>
    <option value="NO" ${value==='NO'?'selected':''}>NO</option>
  </select></div>`;
}
function selectField(labelTxt, path, value, options, readonly){
  return `<div class="field"><label>${labelTxt}</label><select data-field="${path}" ${readonly?'disabled':''}>
    <option value="" ${!value?'selected':''}>Seleccione</option>
    ${options.map(o=>`<option value="${o}" ${value===o?'selected':''}>${o}</option>`).join('')}
  </select></div>`;
}

function renderLocationPanel(sess, readonly){
  const lastLoc = sess.ubicaciones.length ? sess.ubicaciones[sess.ubicaciones.length-1] : null;
  const log = sess.ubicaciones.slice().reverse().map(u=>{
    if(u.lat) return `<div>📍 <a href="${mapLink(u.lat,u.lng)}" target="_blank">${u.lat.toFixed(5)}, ${u.lng.toFixed(5)}</a> — ${fmt(u.timestamp)} <i>(${u.tipo})</i></div>`;
    return `<div>⚠️ Error de ubicación (${u.tipo}) — ${fmt(u.timestamp)}: ${u.error||''}</div>`;
  }).join('') || '<div style="color:var(--muted);">Aún no hay registros de ubicación.</div>';
  let actions = '';
  if(!readonly){
    actions = `<div class="row-actions" style="margin-top:8px;">
      <button class="btn secondary small" id="btn-gps-auto">📍 Generar ubicación GPS ahora</button>
    </div>
    <div class="manual-loc">
      <div class="field"><label>Latitud (manual)</label><input id="manual-lat" placeholder="Ej: 8.31234"></div>
      <div class="field"><label>Longitud (manual)</label><input id="manual-lng" placeholder="Ej: -75.4023"></div>
      <button class="btn ghost small" id="btn-gps-manual">➕ Pegar ubicación manual</button>
    </div>`;
  }
  return `<div class="card"><h2>📍 Ubicación GPS</h2>
    <div class="loc-panel">
      <div>Última ubicación: ${lastLoc ? (lastLoc.lat? `<a href="${mapLink(lastLoc.lat,lastLoc.lng)}" target="_blank">${lastLoc.lat.toFixed(5)}, ${lastLoc.lng.toFixed(5)}</a> (${fmt(lastLoc.timestamp)}, ${lastLoc.tipo})` : `error — ${fmt(lastLoc.timestamp)}`) : 'aún sin registrar'}</div>
      ${actions}
      <div class="loc-log">${log}</div>
    </div>
  </div>`;
}

function renderForm(sess, readonly){
  if(!sess) return `<div class="card"><div class="empty">Sesión no encontrada.</div></div>`;
  const g=sess.general, a=sess.actividad;
  let html = '';
  if(readonly) html += `<div class="readonly-note">👁️ Estás viendo esta OT en modo solo lectura (supervisor). Se actualiza automáticamente.</div>`;

  html += `<div class="card"><h2>OT ${sess.id} <span class="status-pill ${sess.status}" style="margin-left:8px;">${sess.status==='en_progreso'?'En progreso':'Finalizado'}</span></h2>
    ${readonly?`<div class="row-actions"><button class="btn secondary small" data-pdf="${sess.id}">⬇️ PDF</button>${isMasterAdmin()?`<button class="btn danger small" data-delete="${sess.id}">🗑️ Borrar</button>`:''}</div>`:''}
  </div>`;

  html += renderLocationPanel(sess, readonly);

  html += `<div class="card"><h2>1. Información general</h2><div class="grid">
    ${textField('Nombre de estación', 'general.nombreEstacion', g.nombreEstacion, readonly)}
    ${textField('Categoría', 'general.categoria', g.categoria, readonly)}
    ${selectField('Regional', 'general.regional', g.regional, ['R1','R2'], readonly)}
    ${textField('Responsable', 'general.responsable', g.responsable, readonly)}
    ${selectField('Departamento', 'general.departamento', g.departamento, ['ATLANTICO','BOLIVAR','SUCRE','CORDOBA'], readonly)}
    ${textField('No. INC', 'general.noInc', g.noInc, readonly)}
    ${textField('No. TAS', 'general.noTas', g.noTas, readonly)}
    ${textField('Tipo de estación', 'general.tipoEstacion', g.tipoEstacion, readonly)}
    ${textField('Tipo de sitio', 'general.tipoSitio', g.tipoSitio, readonly)}
    ${textField('Site owner', 'general.siteOwner', g.siteOwner, readonly)}
    ${dateField('Fecha ejecución', 'general.fechaEjecucion', g.fechaEjecucion, readonly)}
    ${dateField('Fecha fin actividad', 'general.fechaFin', g.fechaFin, readonly)}
  </div>
  ${textareaField('Dirección o ubicación', 'general.direccion', g.direccion, readonly)}
  </div>`;

  html += `<div class="card"><h2>2. Información de la actividad</h2><div class="grid">
    ${textField('Tipo de actividad', 'actividad.tipoActividad', a.tipoActividad, readonly)}
    ${textField('Tipo de equipo en falla', 'actividad.tipoEquipoFalla', a.tipoEquipoFalla, readonly)}
    ${textField('Subsistema', 'actividad.subsistema', a.subsistema, readonly)}
    ${textField('Modelo', 'actividad.modelo', a.modelo, readonly)}
  </div><div class="grid">
    ${siNoField('¿Presenta afectación de servicios?', 'actividad.afectacionServicios', a.afectacionServicios, readonly)}
    ${siNoField('Reinstalación', 'actividad.reinstalacion', a.reinstalacion, readonly)}
    ${siNoField('Cambio', 'actividad.cambio', a.cambio, readonly)}
    ${siNoField('Reparación', 'actividad.reparacion', a.reparacion, readonly)}
  </div></div>`;

  html += `<div class="card"><h2>3. Descripción de la falla</h2>${textareaField('', 'descripcionFalla', sess.descripcionFalla, readonly)}</div>`;
  html += `<div class="card"><h2>4. Descripción de la solución</h2>${textareaField('', 'descripcionSolucion', sess.descripcionSolucion, readonly)}</div>`;

  html += `<div class="card"><h2>5. Cambio de repuestos y/o partes</h2>
    <div class="subhead">Repuestos retirados</div>
    ${sess.repuestosRetirados.map((r,i)=>rowCardRepuesto('repuestosRetirados',r,i,readonly)).join('') || (readonly?'<p class="hint">Sin repuestos retirados.</p>':'')}
    ${!readonly?`<button class="add-row-btn" data-addrow="repuestosRetirados">+ Agregar repuesto retirado</button>`:''}
    <div class="subhead">Repuestos instalados</div>
    ${sess.repuestosInstalados.map((r,i)=>rowCardRepuesto('repuestosInstalados',r,i,readonly)).join('') || (readonly?'<p class="hint">Sin repuestos instalados.</p>':'')}
    ${!readonly?`<button class="add-row-btn" data-addrow="repuestosInstalados">+ Agregar repuesto instalado</button>`:''}
  </div>`;

  html += `<div class="card"><h2>6. Listado de materiales utilizados</h2>
    ${sess.materiales.map((m,i)=>rowCardMaterial(m,i,readonly)).join('') || (readonly?'<p class="hint">Sin materiales registrados.</p>':'')}
    ${!readonly?`<button class="add-row-btn" data-addrow="materiales">+ Agregar material</button>`:''}
  </div>`;

  html += `<div class="card"><h2>7. Evidencia fotográfica de la actividad</h2>
    <p class="hint">Agrega cada foto con su propio título (ej: "Panorámica del transformador").</p>
    ${sess.evidencias.map((e,i)=>rowCardEvidencia(e,i,readonly)).join('') || (readonly?'<p class="hint">Sin evidencias registradas.</p>':'')}
    ${!readonly?`<button class="add-row-btn" data-addrow="evidencias">+ Agregar evidencia fotográfica</button>`:''}
  </div>`;

  html += `<div class="card"><h2>8. Hallazgos</h2>
    ${siNoField('¿Se encontraron novedades en la estación?', 'hallazgoSi', sess.hallazgoSi, readonly)}
    ${sess.hallazgoSi==='SI' ? `
      ${textareaField('Observaciones de los hallazgos', 'hallazgosObservaciones', sess.hallazgosObservaciones, readonly)}
      <div class="subhead">Registro fotográfico de hallazgos</div>
      ${(sess.hallazgosFotos||[]).map((f,i)=>rowCardHallazgoFoto(f,i,readonly)).join('') || (readonly?'<p class="hint">Sin fotos registradas.</p>':'')}
      ${!readonly?`<button class="add-row-btn" data-addrow="hallazgosFotos">+ Agregar foto (cámara o archivo)</button>`:''}
      <div class="subhead">Detalle por hallazgo</div>
      ${sess.hallazgos.map((h,i)=>rowCardHallazgo(h,i,readonly)).join('') || (readonly?'<p class="hint">Sin hallazgos registrados.</p>':'')}
      ${!readonly?`<button class="add-row-btn" data-addrow="hallazgos">+ Agregar hallazgo</button>`:''}
    ` : ''}
  </div>`;

  html += `<div class="card"><h2>9. Transporte especiales</h2>
    ${sess.transporte.map((t,i)=>rowCardTransporte(t,i,readonly)).join('') || (readonly?'<p class="hint">No aplica.</p>':'')}
    ${!readonly?`<button class="add-row-btn" data-addrow="transporte">+ Agregar transporte especial</button>`:''}
  </div>`;

  html += `<div class="card"><h2>10. Cierre</h2>
    ${siNoField('¿Falla resuelta?', 'fallaResuelta', sess.fallaResuelta, readonly)}
    ${textareaField('Observaciones de la actividad', 'observaciones', sess.observaciones, readonly)}
    <div class="grid">
      ${textField('Nombre del personal quien ejecuta', 'firma.ejecuta', sess.firma.ejecuta, readonly)}
      ${textField('Empresa quien ejecuta', 'firma.empresa', sess.firma.empresa, readonly)}
      ${textField('Nombre del quien revisa', 'firma.revisa', sess.firma.revisa, readonly)}
      ${textField('Fecha de elaboración', 'firma.fechaElaboracion', sess.firma.fechaElaboracion, readonly)}
    </div>
  </div>`;

  html += `<div class="card"><h2>11. Videos de soporte</h2>
    <p class="hint">Hasta 4 videos, máximo 20 MB cada uno. Quedan guardados en este dispositivo y se sincronizan al servidor para que el supervisor pueda revisarlos.</p>
    ${(sess.videos||[]).map((v,i)=>`
      <div class="row-card">
        <div class="row-card-head"><span class="idx">VIDEO ${i+1} — ${v.nombre||''} (${v.sizeMB||'?'} MB)</span>${!readonly?`<button class="row-del" data-delvideo="${v.id}">Eliminar</button>`:''}</div>
        <video controls data-video-src="${v.id}" style="width:100%;max-width:360px;border-radius:8px;background:#000;"></video>
      </div>`).join('') || (readonly?'<p class="hint">Sin videos adjuntos.</p>':'')}
    ${(!readonly && (sess.videos||[]).length<4)?`
      <button type="button" class="add-row-btn" id="btn-add-video">+ Agregar video</button>
      <input type="file" accept="video/*" id="video-input" style="display:none;">
    `:''}
  </div>`;

  if(!readonly){
    html += `<div class="row-actions">
      ${sess.status==='en_progreso'?`<button class="btn" id="btn-finalizar">✅ Finalizar atención</button>`:''}
      <button class="btn secondary" id="btn-dl-pdf">⬇️ Descargar PDF</button>
      ${isMasterAdmin()?`<button class="btn danger" id="btn-delete-current">🗑️ Borrar (admin maestro)</button>`:''}
      <button class="btn ghost" id="btn-volver">← Volver al inicio</button>
    </div>`;
  } else {
    html += `<div class="row-actions"><button class="btn ghost" id="btn-volver">← Volver</button></div>`;
  }
  return html;
}

function rowCardRepuesto(arrName, r, i, readonly){
  return `<div class="row-card">
    <div class="row-card-head"><span class="idx">#${i+1}</span>${!readonly?`<button class="row-del" data-delrow="${arrName}|${r.id}">Eliminar</button>`:''}</div>
    <div class="grid">
      <div class="field"><label>Descripción</label><input data-rowfield="${arrName}|${r.id}|descripcion" value="${(r.descripcion||'').replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>
      <div class="field"><label>Marca</label><input data-rowfield="${arrName}|${r.id}|marca" value="${(r.marca||'').replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>
      <div class="field"><label>Modelo</label><input data-rowfield="${arrName}|${r.id}|modelo" value="${(r.modelo||'').replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>
      <div class="field"><label>Serial</label><input data-rowfield="${arrName}|${r.id}|serial" value="${(r.serial||'').replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>
    </div>
  </div>`;
}
function rowCardMaterial(m, i, readonly){
  return `<div class="row-card">
    <div class="row-card-head"><span class="idx">MATERIAL #${i+1}</span>${!readonly?`<button class="row-del" data-delrow="materiales|${m.id}">Eliminar</button>`:''}</div>
    <div class="grid">
      <div class="field"><label>Cantidad</label><input data-rowfield="materiales|${m.id}|cantidad" value="${(m.cantidad||'').replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>
      <div class="field"><label>Unidad</label><input data-rowfield="materiales|${m.id}|unidad" value="${(m.unidad||'').replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>
      <div class="field" style="grid-column:1/-1;"><label>Descripción</label><input data-rowfield="materiales|${m.id}|descripcion" value="${(m.descripcion||'').replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>
    </div>
    <div class="grid" style="margin-top:6px;">
      <div data-photo-cell="materiales|${m.id}|fotoAntes">${photoCellHtml('materiales|'+m.id+'|fotoAntes', m.fotoAntes, readonly, 'Evidencia antes')}</div>
      <div data-photo-cell="materiales|${m.id}|fotoDespues">${photoCellHtml('materiales|'+m.id+'|fotoDespues', m.fotoDespues, readonly, 'Evidencia después')}</div>
    </div>
  </div>`;
}
function rowCardEvidencia(e, i, readonly){
  return `<div class="row-card">
    <div class="row-card-head"><span class="idx">FOTO #${i+1}</span>${!readonly?`<button class="row-del" data-delrow="evidencias|${e.id}">Eliminar</button>`:''}</div>
    <div class="field"><label>Título de la evidencia</label><input data-rowfield="evidencias|${e.id}|caption" placeholder="Ej: Panorámica del transformador" value="${(e.caption||'').replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>
    <div data-photo-cell="evidencias|${e.id}|foto">${photoCellHtml('evidencias|'+e.id+'|foto', e.foto, readonly, 'Foto')}</div>
  </div>`;
}
function rowCardHallazgoFoto(f, i, readonly){
  return `<div class="row-card">
    <div class="row-card-head"><span class="idx">FOTO #${i+1}</span>${!readonly?`<button class="row-del" data-delrow="hallazgosFotos|${f.id}">Eliminar</button>`:''}</div>
    <div data-photo-cell="hallazgosFotos|${f.id}|foto">${photoCellHtml('hallazgosFotos|'+f.id+'|foto', f.foto, readonly, 'Foto de hallazgo')}</div>
  </div>`;
}
function rowCardHallazgo(h, i, readonly){
  return `<div class="row-card">

// ---------- photo groups for PDF ----------
function collectPhotoGroups(sess){
  const groups = [];
  if(sess.evidencias.length) groups.push({title:'Evidencia fotográfica de la actividad', items: sess.evidencias.map(e=>({caption:e.caption||'Evidencia de la actividad', dataUrl:e.foto||null}))});
  if(sess.materiales.length){
    const items = [];
    sess.materiales.forEach((m,i)=>{
      items.push({caption:`Material ${i+1} (${m.descripcion||'s/n'}) — Antes`, dataUrl:m.fotoAntes||null});
      items.push({caption:`Material ${i+1} (${m.descripcion||'s/n'}) — Después`, dataUrl:m.fotoDespues||null});
    });
    groups.push({title:'Evidencia de materiales utilizados', items});
  }
  if((sess.hallazgosFotos||[]).length) groups.push({title:'Fotos generales de hallazgos', items: sess.hallazgosFotos.map((f,i)=>({caption:`Foto de hallazgo ${i+1}`, dataUrl:f.foto||null}))});
  if(sess.hallazgos.length) groups.push({title:'Registro fotográfico de hallazgos', items: sess.hallazgos.map((h,i)=>({caption:`Hallazgo ${i+1} — ${h.sistema||'s/n'}`, dataUrl:h.foto||null}))});
  if(sess.transporte.length) groups.push({title:'Foto transporte especial', items: sess.transporte.map((t,i)=>({caption:`Transporte ${i+1} — ${t.tipo||'s/n'}`, dataUrl:t.foto||null}))});
  return groups;
}

// ---------- EXPORT: PDF helpers ----------
function drawInfoGrid(doc, startX, startY, pairs, colWidth, rowH, cols){
  cols = cols || 2;
  let x=startX, y=startY, col=0;
  pairs.forEach(([label,value])=>{
    doc.setDrawColor(215,213,206);
    doc.rect(x, y, colWidth, rowH);
    doc.setFontSize(6.5); doc.setTextColor(100,100,100); doc.setFont(undefined,'normal');
    const labelText = String(label).toUpperCase()+':';
    doc.text(labelText, x+2, y+rowH/2+1.3);
    const labelW = doc.getTextWidth(labelText);
    doc.setFontSize(8); doc.setTextColor(20,20,20); doc.setFont(undefined,'bold');
    const val = doc.splitTextToSize(String(value===undefined||value===null||value===''?'—':value), colWidth-6-labelW).slice(0,2);
    doc.text(val, x+3+labelW, y+rowH/2+1.3);
    doc.setFont(undefined,'normal');
    col++;
    if(col>=cols){ col=0; x=startX; y+=rowH; } else { x+=colWidth; }
  });
  if(col!==0) y+=rowH;
  return y;
}
function sectionBar(doc, x, y, w, title){
  doc.setFillColor(227,6,19);
  doc.roundedRect(x, y, w, 6, 1.2, 1.2, 'F');
  doc.setFontSize(9); doc.setTextColor(255,255,255); doc.setFont(undefined,'bold');
  doc.text(title, x+2, y+4.2);
  doc.setFont(undefined,'normal');
  return y+6+3;
}
function addHeaderFooter(doc){
  const total = doc.internal.getNumberOfPages();
  const genDate = new Date().toLocaleString('es-CO');
  for(let i=1;i<=total;i++){
    doc.setPage(i);
    if(i===1) continue; // la página 1 ya tiene su propio encabezado rojo
    doc.setFontSize(7.5); doc.setTextColor(130,130,130);
    doc.text(`CLARO / INMEL | O&M - Mantenimiento Correctivo y Emergencias | Generado: ${genDate}`, 14, 8);
    doc.text(`Pág. ${i}`, 196, 8, {align:'right'});
  }
}

// ---------- EXPORT: PDF ----------
function generatePDF(sess){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const marginX=14, rightX=196, W=210;
  const colW = (rightX-marginX)/2;
  const headerH = 37;
  let y = 11;

  doc.setFillColor(227,6,19);
  doc.roundedRect(marginX, 0, rightX-marginX, headerH, 3, 3, 'F');

  doc.setFontSize(17); doc.setFont(undefined,'bold'); doc.setTextColor(255,255,255);
  doc.text('CLARO / INMEL', W/2, y, {align:'center'});
  y += 7;
  doc.setFontSize(10); doc.setFont(undefined,'normal');
  doc.text('OPERACIÓN Y MANTENIMIENTO — MANTENIMIENTO CORRECTIVO Y EMERGENCIAS', W/2, y, {align:'center'});
  y += 7;
  doc.setFontSize(9); doc.setFont(undefined,'bold');
  doc.text(`OT: ${sess.id}`, marginX+10, y);
  doc.text(`Empresa: ${sess.firma.empresa || '—'}`, rightX-10, y, {align:'right'});
  doc.setFont(undefined,'normal');
  y += 5;
  doc.setFontSize(7.5);
  doc.text('Jefatura Técnico Integral — Gerencia Técnica Regional', W/2, y, {align:'center'});
  y = headerH + 5;

  y = sectionBar(doc, marginX, y, rightX-marginX, 'INFORMACIÓN GENERAL');
  const g = sess.general;
  y = drawInfoGrid(doc, marginX, y, [
    ['Nombre de estación', g.nombreEstacion],['Categoría', g.categoria],
    ['Regional', g.regional],['Responsable', g.responsable],
    ['Departamento', g.departamento],['No. INC', g.noInc],
    ['Dirección', g.direccion],['No. TAS', g.noTas],
    ['Tipo de estación', g.tipoEstacion],['Fecha ejecución', fmt(g.fechaEjecucion)],
    ['Tipo de sitio', g.tipoSitio],['Fecha fin actividad', fmt(g.fechaFin)],
    ['Site owner', g.siteOwner],['',''],
  ], colW, 12);
  y += 3;

  y = sectionBar(doc, marginX, y, rightX-marginX, 'INFORMACIÓN DE LA ACTIVIDAD');
  const a = sess.actividad;
  y = drawInfoGrid(doc, marginX, y, [
    ['Tipo de actividad', a.tipoActividad],['Tipo de equipo en falla', a.tipoEquipoFalla],
    ['Subsistema', a.subsistema],['Modelo', a.modelo],
    ['¿Afectación de servicios?', a.afectacionServicios],['Reinstalación', a.reinstalacion],
    ['Cambio', a.cambio],['Reparación', a.reparacion],
  ], colW, 12);
  y += 3;

  y = sectionBar(doc, marginX, y, rightX-marginX, 'DESCRIPCIÓN DE LA FALLA');
  doc.setFontSize(8.5); doc.setTextColor(30,30,30);
  y = wrapText(doc, sess.descripcionFalla || '—', marginX, y, W-28);
  y += 4;
  if(y>260){ doc.addPage(); y=15; }
  y = sectionBar(doc, marginX, y, rightX-marginX, 'DESCRIPCIÓN DE LA SOLUCIÓN');
  y = wrapText(doc, sess.descripcionSolucion || '—', marginX, y, W-28);
  y += 4;

  if(sess.repuestosRetirados.length || sess.repuestosInstalados.length){
    if(y>240){ doc.addPage(); y=15; }
    y = sectionBar(doc, marginX, y, rightX-marginX, 'CAMBIO DE REPUESTOS Y/O PARTES');
    if(sess.repuestosRetirados.length){
      doc.autoTable({startY:y, head:[['Repuestos retirados — Descripción','Marca','Modelo','Serial']],
        body:sess.repuestosRetirados.map(r=>[r.descripcion||'—',r.marca||'—',r.modelo||'—',r.serial||'—']),
        theme:'grid', styles:{fontSize:7.5}, headStyles:{fillColor:[40,40,40]}});
      y = doc.lastAutoTable.finalY+3;
    }
    if(sess.repuestosInstalados.length){
      doc.autoTable({startY:y, head:[['Repuestos instalados — Descripción','Marca','Modelo','Serial']],
        body:sess.repuestosInstalados.map(r=>[r.descripcion||'—',r.marca||'—',r.modelo||'—',r.serial||'—']),
        theme:'grid', styles:{fontSize:7.5}, headStyles:{fillColor:[40,40,40]}});
      y = doc.lastAutoTable.finalY+4;
    }
  }

  if(sess.materiales.length){
    if(y>240){ doc.addPage(); y=15; }
    y = sectionBar(doc, marginX, y, rightX-marginX, 'LISTADO DE MATERIALES UTILIZADOS');
    doc.autoTable({startY:y, head:[['Cantidad','Unidad','Descripción','Evidencia']],
      body:sess.materiales.map(m=>[m.cantidad||'—',m.unidad||'—',m.descripcion||'—', (m.fotoAntes?'Antes ✓ ':'Antes — ')+(m.fotoDespues?'Después ✓':'Después —')]),
      theme:'grid', styles:{fontSize:7.5}, headStyles:{fillColor:[40,40,40]}});
    y = doc.lastAutoTable.finalY+4;
  }

  if(sess.hallazgos.length || sess.hallazgoSi){
    if(y>240){ doc.addPage(); y=15; }
    y = sectionBar(doc, marginX, y, rightX-marginX, 'HALLAZGOS');
    doc.setFontSize(8); doc.setTextColor(30,30,30);
    y = wrapText(doc, `¿Se encontraron novedades en la estación? ${sess.hallazgoSi||'—'}`, marginX, y, W-28);
    if(sess.hallazgoSi==='SI'){
      y = wrapText(doc, `Observaciones de los hallazgos: ${sess.hallazgosObservaciones||'—'}`, marginX, y+2, W-28);
    }
    y += 2;
    if(sess.hallazgos.length){
      doc.autoTable({startY:y, head:[['#','Sistema','Prioridad','Descripción','Resuelto en visita']],
        body:sess.hallazgos.map((h,i)=>[i+1,h.sistema||'—',h.prioridad,h.descripcion||'—',h.resuelto||'—']),
        theme:'grid', styles:{fontSize:7.5}, headStyles:{fillColor:[40,40,40]}});
      y = doc.lastAutoTable.finalY+4;
    }
  }

  if(sess.transporte.length){
    if(y>240){ doc.addPage(); y=15; }
    y = sectionBar(doc, marginX, y, rightX-marginX, 'TRANSPORTE ESPECIALES');
    doc.autoTable({startY:y, head:[['Distancia KM','Tiempo desplazamiento','Tipo transporte','Observación']],
      body:sess.transporte.map(t=>[t.distanciaKm||'—',t.tiempo||'—',t.tipo||'—',t.observacion||'—']),
      theme:'grid', styles:{fontSize:7.5}, headStyles:{fillColor:[40,40,40]}});
    y = doc.lastAutoTable.finalY+4;
  }

  const ubicBody = sess.ubicaciones.map(u=>[u.tipo, u.lat? u.lat.toFixed(5):'—', u.lng? u.lng.toFixed(5):'—', fmt(u.timestamp), u.error||'']);
  if(ubicBody.length){
    if(y>240){ doc.addPage(); y=15; }
    doc.autoTable({startY:y, head:[['Ubicación GPS','Latitud','Longitud','Fecha/Hora','Error']], body:ubicBody, theme:'grid', styles:{fontSize:7}, headStyles:{fillColor:[40,40,40]}});
    y = doc.lastAutoTable.finalY+4;
  }

  if(y>250){ doc.addPage(); y=15; }
  doc.setFontSize(9); doc.setTextColor(30,30,30); doc.setFont(undefined,'bold');
  doc.text(`FALLA RESUELTA: ${sess.fallaResuelta||'—'}`, marginX, y); y+=6;
  doc.setFont(undefined,'normal');
  doc.setFontSize(8.5);
  y = wrapText(doc, `Observaciones de la actividad: ${sess.observaciones||'—'}`, marginX, y, W-28);
  y += 4;
  y = wrapText(doc, `Nombre del personal quien ejecuta: ${sess.firma.ejecuta||'—'}`, marginX, y, W-28);
  y = wrapText(doc, `Empresa quien ejecuta: ${sess.firma.empresa||'—'}`, marginX, y+2, W-28);
  y = wrapText(doc, `Nombre del quien revisa: ${sess.firma.revisa||'—'}`, marginX, y+2, W-28);
  y = wrapText(doc, `Fecha de elaboración: ${sess.firma.fechaElaboracion||'—'}`, marginX, y+2, W-28);

  const groups = collectPhotoGroups(sess);
  if(groups.length){
    doc.addPage();
    doc.setFontSize(12); doc.setTextColor(227,6,19); doc.setFont(undefined,'bold');
    doc.text('EVIDENCIA FOTOGRÁFICA DE LA ACTIVIDAD', 14, 15);
    doc.setFont(undefined,'normal');
    const boxW=88, imgH=60, rowH=76;
    let py=24;
    groups.forEach(group=>{
      if(py>250){ doc.addPage(); py=15; }
      doc.setFillColor(70,70,70);
      doc.roundedRect(14, py-4.5, 182, 6, 1.2, 1.2, 'F');
      doc.setFontSize(8.5); doc.setTextColor(255,255,255); doc.setFont(undefined,'bold');
      doc.text(group.title.toUpperCase(), 14+91, py-0.3, {align:'center'});
      doc.setFont(undefined,'normal');
      py += 5;
      let x=14, col=0;
      group.items.forEach(it=>{
        if(col===0 && py+rowH>292){ doc.addPage(); py=15; }
        doc.setDrawColor(190,188,182);
        doc.rect(x,py,boxW,imgH+8);
        if(it.dataUrl){
          try{ doc.addImage(it.dataUrl,'JPEG',x,py,boxW,imgH); }catch(e){}
        } else {
          doc.setFillColor(249,248,245);
          doc.rect(x,py,boxW,imgH,'F');
          doc.setFontSize(7.5); doc.setTextColor(170,170,165);
          doc.text('Sin foto', x+boxW/2, py+imgH/2, {align:'center'});
        }
        doc.setFillColor(225,223,217);
        doc.rect(x,py+imgH,boxW,8,'F');
        doc.setFontSize(7); doc.setTextColor(40,40,40);
        const lines = doc.splitTextToSize(it.caption, boxW-4).slice(0,2);
        doc.text(lines, x+boxW/2, py+imgH+3.5, {align:'center'});
        col++;
        if(col>=2){ col=0; x=14; py+=rowH; } else { x+=boxW+6; }
      });
      if(col!==0){ py+=rowH; col=0; }
      py += 5;
    });
  }

  addHeaderFooter(doc);
  doc.save(`Emergencia_${sess.id}.pdf`);
}
function wrapText(doc, text, x, y, maxWidth){
  const lines = doc.splitTextToSize(text, maxWidth);
  lines.forEach((line,i)=>{
    if(y> 285){ doc.addPage(); y=15; }
    doc.text(line, x, y+ (i*4.2));
  });
  return y + lines.length*4.2;
}


// ---------- EVENTS ----------
function setPath(obj, path, val){
  const parts = path.split('.'); let o = obj;
  for(let i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = val;
}
let saveDebounce=null;
function debouncedSave(){
  if(saveDebounce) clearTimeout(saveDebounce);
  saveDebounce = setTimeout(()=>{ saveSessionSafe(state.currentSession); }, 500);
}
async function handleDownload(id, type){
  const sess = await loadSession(id);
  if(!sess){ alert('No se encontró ese reporte.'); return; }
  generatePDF(sess);
}
async function handleDelete(id){
  if(!isMasterAdmin()){ alert('Solo el administrador maestro puede borrar formatos.'); render(); return; }
  if(!confirm(`¿Eliminar permanentemente el reporte ${id}? Esta acción no se puede deshacer.`)) return;
  await deleteSessionEverywhere(id);
  render();
}

function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = ()=>{ stopLocationLoop(); stopLiveRefresh(); if(b.dataset.tipo) state.pendingTipo = b.dataset.tipo; state.view = b.dataset.nav; render(); };
  });

  const btnCrearOt = document.getElementById('btn-crear-ot');
  if(btnCrearOt) btnCrearOt.onclick = async ()=>{
    if(isAdminOnlyMode()){ alert('Como administrador no tienes permiso para crear nuevos formatos.'); return; }
    const otVal = document.getElementById('ot-input').value.trim();
    state.currentSession = emptySession(otVal);
    if(state.pendingTipo){ state.currentSession.actividad.tipoActividad = state.pendingTipo; state.pendingTipo = null; }
    state.view = "form";
    render();
    await saveSessionSafe(state.currentSession);
    startLocationLoop(state.currentSession);
  };

  document.querySelectorAll('[data-open]').forEach(r=>{
    r.onclick = async ()=>{
      const sess = await loadSession(r.dataset.open);
      if(!sess) return;
      if(sess.status==='en_progreso' || isMasterAdmin()){
        state.currentSession = sess; state.view = "form"; render();
        if(sess.status==='en_progreso') startLocationLoop(sess);
      } else {
        state.viewedSession = sess; state.view = "viewsession"; render();
      }
    };
  });
  document.querySelectorAll('[data-watch]').forEach(r=>{
    r.onclick = async ()=>{
      state.viewerId = r.dataset.watch;
      state.viewedSession = await loadSession(state.viewerId);
      state.view = "viewsession"; render(); startLiveRefresh();
    };
  });

  document.querySelectorAll('[data-pdf]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); handleDownload(b.dataset.pdf,'pdf'); });
  document.querySelectorAll('[data-delete]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); handleDelete(b.dataset.delete); });

  document.querySelectorAll('input[data-field], textarea[data-field], select[data-field]').forEach(inp=>{
    const isSelect = inp.tagName==='SELECT';
    const evt = isSelect ? 'onchange' : 'oninput';
    inp[evt] = async ()=>{
      let val = inp.value;
      if(inp.dataset.iso && val){ val = new Date(val).toISOString(); }
      setPath(state.currentSession, inp.dataset.field, val);
      if(isSelect){
        await saveSessionSafe(state.currentSession);
        render();
      } else {
        debouncedSave();
      }
    };
  });

  document.querySelectorAll('[data-rowfield]').forEach(inp=>{
    const isSelect = inp.tagName==='SELECT';
    const evt = isSelect ? 'onchange' : 'oninput';
    inp[evt] = async ()=>{
      const [arrName, rowId, field] = inp.dataset.rowfield.split('|');
      const row = findRow(arrName, rowId);
      if(row){
        row[field] = inp.value;
        if(isSelect){ await saveSessionSafe(state.currentSession); render(); }
        else debouncedSave();
      }
    };
  });

  document.querySelectorAll('[data-addrow]').forEach(b=>{
    b.onclick = ()=>{
      const arrName = b.dataset.addrow;
      state.currentSession[arrName].push(ROW_TEMPLATES[arrName]());
      saveSessionSafe(state.currentSession);
      render();
    };
  });
  document.querySelectorAll('[data-delrow]').forEach(b=>{
    b.onclick = ()=>{
      const [arrName, rowId] = b.dataset.delrow.split('|');
      state.currentSession[arrName] = state.currentSession[arrName].filter(r=>r.id!==rowId);
      saveSessionSafe(state.currentSession);
      render();
    };
  });

  const btnAddVideo = document.getElementById('btn-add-video');
  if(btnAddVideo) btnAddVideo.onclick = ()=>{ const inp = document.getElementById('video-input'); if(inp) inp.click(); };
  const videoInput = document.getElementById('video-input');
  if(videoInput) videoInput.onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('video/')){ alert('Selecciona un archivo de video.'); e.target.value=''; return; }
    const sizeMB = file.size/1024/1024;
    if(sizeMB > VIDEO_MAX_MB){ alert(`El video pesa ${sizeMB.toFixed(1)} MB y el máximo permitido es ${VIDEO_MAX_MB} MB. Elige un archivo más liviano.`); e.target.value=''; return; }
    if((state.currentSession.videos||[]).length>=4){ alert('Ya alcanzaste el máximo de 4 videos.'); return; }
    const reader = new FileReader();
    reader.onload = async ()=>{
      const dataUrl = reader.result;
      const vid = {id: rid(), nombre: file.name, sizeMB: sizeMB.toFixed(1)};
      await saveVideoData(state.currentSession.id, vid.id, dataUrl);
      state.currentSession.videos = state.currentSession.videos || [];
      state.currentSession.videos.push(vid);
      await saveSessionSafe(state.currentSession);
      render();
    };
    reader.onerror = ()=> alert('No se pudo leer el video, intenta de nuevo.');
    reader.readAsDataURL(file);
  };
  document.querySelectorAll('[data-delvideo]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('¿Eliminar este video?')) return;
      const vidId = b.dataset.delvideo;
      const sess = activeSession();
      sess.videos = (sess.videos||[]).filter(v=>v.id!==vidId);
      await deleteVideoData(sess.id, vidId);
      await saveSessionSafe(sess);
      render();
    };
  });
  document.querySelectorAll('[data-video-src]').forEach((el)=>{
    const vidId = el.dataset.videoSrc;
    const sess = activeSession();
    if(!sess) return;
    loadVideoData(sess.id, vidId).then(data=>{ if(data) el.src = data; });
  });

  const btnFin = document.getElementById('btn-finalizar');
  if(btnFin) btnFin.onclick = async ()=>{
    if(!confirm('¿Finalizar esta atención? Ya no se pedirá más ubicación automática.')) return;
    state.currentSession.status = 'finalizado';
    state.currentSession.general.fechaFin = nowIso();
    if(!state.currentSession.firma.fechaElaboracion) state.currentSession.firma.fechaElaboracion = new Date().toLocaleDateString('es-CO');
    await saveSessionSafe(state.currentSession);
    stopLocationLoop();
    state.view = 'finalizado';
    render();
  };

  const btnGpsAuto = document.getElementById('btn-gps-auto');
  if(btnGpsAuto) btnGpsAuto.onclick = ()=> captureLocation(state.currentSession, 'manual');
  const btnGpsManual = document.getElementById('btn-gps-manual');
  if(btnGpsManual) btnGpsManual.onclick = async ()=>{
    const lat = parseFloat(document.getElementById('manual-lat').value);
    const lng = parseFloat(document.getElementById('manual-lng').value);
    if(isNaN(lat) || isNaN(lng)){ alert('Ingresa latitud y longitud válidas.'); return; }
    state.currentSession.ubicaciones.push({lat, lng, timestamp:nowIso(), tipo:'pegada manualmente'});
    await saveSessionSafe(state.currentSession);
    render();
  };

  const btnDlPdf = document.getElementById('btn-dl-pdf');
  if(btnDlPdf) btnDlPdf.onclick = ()=> generatePDF(state.currentSession);
  const btnDeleteCurrent = document.getElementById('btn-delete-current');
  if(btnDeleteCurrent) btnDeleteCurrent.onclick = async ()=>{ await handleDelete(state.currentSession.id); state.view = 'historial'; render(); };
  const btnOtroFormato = document.getElementById('btn-otro-formato');
  if(btnOtroFormato) btnOtroFormato.onclick = ()=>{ state.view = 'nuevo'; render(); };
  const btnVerHistorial = document.getElementById('btn-ver-historial');
  if(btnVerHistorial) btnVerHistorial.onclick = ()=>{ state.view = 'historial'; render(); };
  const btnVolver = document.getElementById('btn-volver');
  if(btnVolver) btnVolver.onclick = ()=>{ stopLiveRefresh(); stopLocationLoop(); state.view = 'home'; render(); };
}

// ---------- delegated photo handlers ----------
function setupPhotoDelegation(){
  const app = document.getElementById('app');
  app.addEventListener('click', (e)=>{
    const camBtn = e.target.closest('[data-cam]');
    if(camBtn){ const input = camBtn.parentElement.querySelector('.photo-input'); input.setAttribute('capture','environment'); input.click(); return; }
    const galBtn = e.target.closest('[data-gal]');
    if(galBtn){ const input = galBtn.parentElement.querySelector('.photo-input'); input.removeAttribute('capture'); input.click(); return; }
    const delBtn = e.target.closest('[data-delphoto]');
    if(delBtn){
      const key = delBtn.dataset.delphoto;
      if(!confirm('¿Eliminar esta foto?')) return;
      const [arrName, rowId, field] = key.split('|');
      const row = findRow(arrName, rowId);
      if(!row) return;
      row[field] = null;
      saveSessionSafe(state.currentSession);
      const cell = document.querySelector(`[data-photo-cell="${key}"]`);
      if(cell) cell.innerHTML = photoCellHtml(key, null, false, cell.querySelector('.foto-col-title')?cell.querySelector('.foto-col-title').textContent:'Evidencia');
      return;
    }
    const enlarge = e.target.closest('[data-enlarge]');
    if(enlarge){
      const key = enlarge.dataset.enlarge;
      const [arrName, rowId, field] = key.split('|');
      const row = findRow(arrName, rowId);
      if(row && row[field]) openPhotoModal(row[field], field);
      return;
    }
  });
  app.addEventListener('change', async (e)=>{
    const input = e.target.closest('.photo-input');
    if(input && input.files && input.files[0]){
      const key = input.dataset.key;
      const file = input.files[0];
      try{
        const dataUrl = await compressImage(file);
        const [arrName, rowId, field] = key.split('|');
        const row = findRow(arrName, rowId);
        if(row){
          row[field] = dataUrl;
          const ok = await saveSessionSafe(state.currentSession);
          const cell = document.querySelector(`[data-photo-cell="${key}"]`);
          const lbl = cell && cell.querySelector('.foto-col-title') ? cell.querySelector('.foto-col-title').textContent : 'Evidencia';
          if(cell) cell.innerHTML = photoCellHtml(key, dataUrl, false, lbl);
          if(!ok) alert('La foto se agregó pero no se pudo guardar. Considera eliminar alguna foto anterior.');
        }
      }catch(err){ alert('No se pudo procesar la foto: ' + err.message); }
      input.value = '';
    }
  });
  document.getElementById('photo-modal-close').onclick = closePhotoModal;
  document.getElementById('photo-modal').onclick = (e)=>{ if(e.target.id==='photo-modal') closePhotoModal(); };
}
function openPhotoModal(src, caption){
  document.getElementById('photo-modal-img').src = src;
  document.getElementById('photo-modal-caption').textContent = caption||'';
  document.getElementById('photo-modal').classList.add('show');
}
function closePhotoModal(){ document.getElementById('photo-modal').classList.remove('show'); }

function startLiveRefresh(){
  stopLiveRefresh();
  state.liveTimer = setInterval(async ()=>{
    if(state.view==='viewsession' && state.viewerId){
      const fresh = await loadSession(state.viewerId);
      if(fresh){ state.viewedSession = fresh; render(); } else { state.view='supervisor'; render(); }
    }
  }, 6000);
}
function stopLiveRefresh(){ if(state.liveTimer){ clearInterval(state.liveTimer); state.liveTimer=null; } }

setupPhotoDelegation();
render();
})();
</script>
