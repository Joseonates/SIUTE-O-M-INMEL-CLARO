<style>

  #install-banner{display:none;background:#0f766e;color:#fff;padding:10px 14px;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;}

  #app{
    --ink:#1c2e4a; --ink-dark:#101c2e; --red:#E30613; --red-dark:#a30410; --paper:#f4f5f7;
    --panel:#ffffff; --line:#e1e4ea; --muted:#6b7280; --good:#1e8a4c; --bad:#c8102e; --amber:#b8860b;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  #app *{box-sizing:border-box;}
  #app{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);}
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  #app .center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 18px;}
  #app .box{width:100%;max-width:420px;}
  #app .logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;}
  #app .logo-mark{width:46px;height:46px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
  #app .logo-text{text-align:left;}
  #app .logo-text .t1{font-size:15px;font-weight:800;}
  #app .logo-text .t2{font-size:11.5px;color:var(--muted);}
  #app .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 2px 14px rgba(20,30,50,.06);}
  #app .card h2{font-size:16px;margin:0 0 6px;}
  #app .card p.sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;line-height:1.5;}
  #app label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  #app input, #app select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:#fff;color:var(--ink);}
  #app .field{margin-bottom:12px;}
  #app .btn{border:none;background:var(--red);color:#fff;padding:11px 16px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;width:100%;}
  #app .btn:hover{background:var(--red-dark);}
  #app .btn.secondary{background:var(--ink);color:#fff;}
  #app .btn.secondary:hover{background:var(--ink-dark);}
  #app .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600;}
  #app .btn.small{padding:7px 12px;font-size:12.5px;width:auto;}
  #app .btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad);}
  #app .link-btn{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;margin-top:16px;display:block;text-align:center;width:100%;}
  #app .status-box{text-align:center;padding:10px 0;}
  #app .status-box .big{font-size:38px;margin-bottom:10px;}
  #app .row-actions{display:flex;gap:8px;margin-top:14px;}
  #app .row-actions .btn{width:auto;flex:1;}

  #app .topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--ink);padding:14px 16px;background:var(--panel);}
  #app .topbar .who{font-size:12px;color:var(--muted);}
  #app .topbar .who b{color:var(--ink);}
  #app .topbar .actions{display:flex;gap:8px;}

  #app .selector-wrap{padding:20px 16px;flex:1;}
  #app .tpl-grid{display:grid;grid-template-columns:1fr;gap:14px;max-width:520px;margin:0 auto;}
  @media(min-width:520px){ #app .tpl-grid{grid-template-columns:1fr 1fr;} }
  #app .tpl-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 20px;cursor:pointer;transition:.15s;text-align:center;}
  #app .tpl-card:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:0 6px 18px rgba(20,30,50,.08);}
  #app .tpl-card .icon{font-size:34px;margin-bottom:10px;}
  #app .tpl-card h3{margin:0 0 6px;font-size:16px;}
  #app .tpl-card p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4;}

  #app .iframe-wrap{flex:1;display:flex;flex-direction:column;}
  #app .iframe-wrap iframe{flex:1;border:none;width:100%;min-height:70vh;}
  #app .iframe-note{font-size:11px;color:var(--muted);background:#fff8e8;border-bottom:1px solid #f0d98c;padding:8px 16px;line-height:1.4;}

  #app table{width:100%;border-collapse:collapse;font-size:12.5px;}
  #app th{background:#f7f8fa;text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);font-size:10.5px;text-transform:uppercase;color:var(--muted);}
  #app td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  #app .status-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;}
  #app .status-pill.pendiente{background:#fff4e0;color:var(--amber);}
  #app .status-pill.autorizado{background:#e5f6ea;color:var(--good);}
  #app .status-pill.rechazado{background:#fbe7e6;color:var(--bad);}
  #app .admin-wrap{padding:18px 16px;max-width:760px;margin:0 auto;width:100%;}
  #app .subhead{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;}
  #app .empty{text-align:center;color:var(--muted);padding:20px;font-size:13px;}
  #app .warn-box{background:#fff8e8;border:1px solid #f0d98c;color:#7a5c00;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:14px;}

<script>
/* ============================================================
   Almacenamiento con sincronización real (Firebase Firestore)
   — compartido por el selector, Plantas Eléctricas y Emergencias,
   todos en este mismo archivo.

   ⚠️ PASO OBLIGATORIO ANTES DE USAR: reemplaza el objeto
   firebaseConfig de abajo con el de TU proyecto de Firebase.
   Instrucciones completas en INSTRUCCIONES.md.
   ============================================================ */
(function () {
  const firebaseConfig = {
    apiKey: "PEGA_AQUI_TU_API_KEY",
    authDomain: "PEGA_AQUI_TU_PROYECTO.firebaseapp.com",
    projectId: "PEGA_AQUI_TU_PROYECTO",
    storageBucket: "PEGA_AQUI_TU_PROYECTO.appspot.com",
    messagingSenderId: "000000000000",
    appId: "1:000000000000:web:xxxxxxxxxxxxxxxxxxxxxxxx"
  };

  if (firebaseConfig.apiKey === "PEGA_AQUI_TU_API_KEY") {
    console.warn("⚠️ Falta configurar Firebase: edita firebaseConfig en index.html (ver INSTRUCCIONES.md).");
  }

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const CHUNK_SIZE = 700000;

  function sanitize(key) { return String(key).replace(/[\/.]/g, "_"); }

  const DB_NAME = "suite-om-merged-local-db";
  const STORE = "kv";
  function openLocalDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function localGet(key) {
    const ldb = await openLocalDB();
    return new Promise((resolve, reject) => {
      const tx = ldb.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = () => resolve(req.result !== undefined ? { key, value: req.result } : null);
      req.onerror = () => reject(req.error);
    });
  }
  async function localSet(key, value) {
    const ldb = await openLocalDB();
    return new Promise((resolve, reject) => {
      const tx = ldb.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = () => resolve({ key, value });
      tx.onerror = () => reject(tx.error);
    });
  }
  async function localDelete(key) {
    const ldb = await openLocalDB();
    return new Promise((resolve, reject) => {
      const tx = ldb.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = () => resolve({ key, deleted: true });
      tx.onerror = () => reject(tx.error);
    });
  }

  window.storage = {
    async get(key, shared) {
      if (!shared) return localGet(key);
      const id = sanitize(key);
      const manifestSnap = await db.collection("storage_meta").doc(id).get();
      if (!manifestSnap.exists) return null;
      const chunkSnaps = await db.collection("storage_meta").doc(id).collection("chunks")
        .orderBy(firebase.firestore.FieldPath.documentId()).get();
      let value = "";
      chunkSnaps.forEach((doc) => { value += doc.data().data; });
      return { key, value };
    },
    async set(key, value, shared) {
      if (!shared) return localSet(key, value);
      const id = sanitize(key);
      const chunks = [];
      for (let i = 0; i < value.length; i += CHUNK_SIZE) chunks.push(value.slice(i, i + CHUNK_SIZE));
      const colRef = db.collection("storage_meta").doc(id).collection("chunks");
      const existing = await colRef.get();
      const writes = [];
      chunks.forEach((c, i) => { writes.push(colRef.doc(String(i).padStart(5, "0")).set({ data: c })); });
      existing.forEach((doc) => {
        const idx = parseInt(doc.id, 10);
        if (idx >= chunks.length) writes.push(doc.ref.delete());
      });
      writes.push(db.collection("storage_meta").doc(id).set({ chunkCount: chunks.length, updatedAt: Date.now() }));
      await Promise.all(writes);
      return { key, value };
    },
    async delete(key, shared) {
      if (!shared) return localDelete(key);
      const id = sanitize(key);
      const chunkSnap = await db.collection("storage_meta").doc(id).collection("chunks").get();
      const writes = [];
      chunkSnap.forEach((doc) => writes.push(doc.ref.delete()));
      writes.push(db.collection("storage_meta").doc(id).delete());
      await Promise.all(writes);
      return { key, deleted: true };
    },
    async list(prefix, shared) {
      if (!shared) return { keys: [] };
      const p = sanitize(prefix || "");
      const snap = await db.collection("storage_meta")
        .where(firebase.firestore.FieldPath.documentId(), ">=", p)
        .where(firebase.firestore.FieldPath.documentId(), "<", p + "\uf8ff")
        .get();
      const keys = [];
      snap.forEach((doc) => keys.push(doc.id));
      return { keys };
    },
  };
})();
</script>

<script>
// ===================== SELECTOR / CONTROL DE ACCESO =====================
(function(){

/* ⚠️ Cambia esta contraseña de administrador antes de usar la app.
   Esto es un candado simple (no es autenticación segura real):
   cualquiera que vea el código fuente puede verla. Sirve para
   evitar que cualquier técnico entre al panel por accidente, no
   para proteger datos sensibles frente a alguien que inspeccione
   el código. */
const ADMIN_PASSWORD = "admin2026";
/* ⚠️ Administrador MAESTRO: además de gestionar usuarios, tiene permiso
   dentro de Plantas Eléctricas y Emergencias para editar y borrar
   formatos ya finalizados (algo que ningún otro usuario, ni siquiera
   el administrador normal, puede hacer). Cambia esta contraseña también. */
const MASTER_ADMIN_PASSWORD = "maestro2026";

const TEMPLATES = [
  { id:'plantas', title:'Plantas Eléctricas', desc:'Mantenimiento preventivo — checklist, pruebas y filtración.', icon:'⚡', src:'plantas/index.html' },
  { id:'emergencias', title:'Emergencias', desc:'Atención de emergencias en campo.', icon:'🚨', src:'emergencias/index.html?tipo=Emergencia' },
  { id:'correctivos', title:'Correctivos', desc:'Mantenimiento correctivo en campo (mismo formato que Emergencias).', icon:'🔧', src:'emergencias/index.html?tipo=Correctivo' },
];

let state = { view:'loading', miCedula: localStorage.getItem('miCedula')||'', miNombre: localStorage.getItem('miNombre')||'', miEstado:null, isAdmin:false, activeTemplate:null };

function nowIso(){ return new Date().toISOString(); }
function fmt(dt){ if(!dt) return "—"; return new Date(dt).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'}); }
function isMasterActive(){ try{ return localStorage.getItem('masterAdmin')==='1'; }catch(e){ return false; } }
function isAdminActive(){ try{ return localStorage.getItem('adminActive')==='1' || isMasterActive(); }catch(e){ return false; } }

// ---------- formatos en ejecución (variante sincronizada: mismo Firestore que Plantas/Emergencias) ----------
async function getRunningFormats(){
  const all = [];
  for(const tipo of ['plantas','emergencias']){
    try{
      const listing = await window.storage.list(tipo+'-index-entry:', true);
      const keys = (listing && listing.keys) || [];
      const entries = await Promise.all(keys.map(async k=>{
        try{ const r = await window.storage.get(k, true); return r?JSON.parse(r.value):null; }catch(e){ return null; }
      }));
      entries.filter(Boolean).forEach(e=> all.push(e));
    }catch(e){}
  }
  all.sort((a,b)=> new Date(b.updatedAt||0)-new Date(a.updatedAt||0));
  return all;
}

// ---------- generic entity storage (mismo patrón que las otras apps) ----------
function summarize(type, obj){
  if(type==='usuario') return {id:obj.id, cedula:obj.cedula, nombre:obj.nombre, estado:obj.estado, rol:obj.rol||'tecnico', activo:obj.activo!==false, solicitadoAt:obj.solicitadoAt, autorizadoAt:obj.autorizadoAt};
  return {id:obj.id};
}
async function saveEntity(type, obj){
  obj.updatedAt = nowIso();
  await window.storage.set(`${type}:${obj.id}`, JSON.stringify(obj), true);
  await window.storage.set(`${type}-idx:${obj.id}`, JSON.stringify(summarize(type,obj)), true);
}
async function loadEntity(type, id){
  try{ const r = await window.storage.get(`${type}:${id}`, true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; }
}
async function getEntityIndex(type){
  try{
    const listing = await window.storage.list(`${type}-idx:`, true);
    const keys = (listing && listing.keys) || [];
    const entries = await Promise.all(keys.map(async k=>{ try{ const r = await window.storage.get(k, true); return r?JSON.parse(r.value):null; }catch(e){ return null; } }));
    return entries.filter(Boolean);
  }catch(e){ return []; }
}
async function deleteEntity(type, id){
  try{ await window.storage.delete(`${type}:${id}`, true); }catch(e){}
  try{ await window.storage.delete(`${type}-idx:${id}`, true); }catch(e){}
}

function emptyUsuario(cedula, nombre){
  return { id:cedula, cedula, nombre, estado:'pendiente', rol:'tecnico', activo:true, solicitadoAt: nowIso(), autorizadoAt:null };
}
function applyRoleFlags(u){
  if(u.rol==='administrador'){ localStorage.setItem('adminActive','1'); }
  else { localStorage.removeItem('adminActive'); }
  // el modo maestro NUNCA se hereda por rol ni por sesión anterior en el dispositivo —
  // solo se activa entrando explícitamente con la contraseña maestra.
  localStorage.removeItem('masterAdmin');
}

// ---------- bootstrap: revisar si mi cédula ya está guardada y su estado actual ----------
async function bootstrap(){
  if(!state.miCedula){
    if(localStorage.getItem('masterAdmin')==='1' || localStorage.getItem('adminActive')==='1'){
      // Sesión de administrador/maestro (entrada por contraseña, sin cédula asociada):
      // se recuerda en este dispositivo para no pedir la contraseña en cada recarga.
      state.isAdmin = true;
      state.view = 'selector';
      seedHistory();
      render();
      return;
    }
    state.view = 'login'; seedHistory(); render(); return;
  }
  const u = await loadEntity('usuario', state.miCedula);
  if(!u){ state.view = 'login'; seedHistory(); render(); return; }
  state.miEstado = u.estado;
  state.miNombre = u.nombre;
  if(u.estado === 'autorizado' && u.activo===false){ state.view = 'disabled'; }
  else if(u.estado === 'autorizado'){ applyRoleFlags(u); state.view = 'selector'; }
  else if(u.estado === 'pendiente'){ state.view = 'pending'; }
  else { state.view = 'rejected'; }
  seedHistory();
  render();
}
function seedHistory(){
  try{ history.replaceState({view: state.view, activeTemplate: state.activeTemplate, isAdmin: state.isAdmin}, '', '#'+state.view); }catch(e){}
}

// ---------- RENDER ----------
function logoRow(){
  return `<div class="logo-row"><div class="logo-mark">O&amp;M</div><div class="logo-text"><div class="t1">Claro / INMEL</div><div class="t2">Suite de formatos de campo</div></div></div>`;
}

// ---------- navegación con historial real (atrás/adelante del navegador) ----------
function go(view, extra){
  state.view = view;
  if(extra) Object.assign(state, extra);
  try{ history.pushState({view, activeTemplate: state.activeTemplate, isAdmin: state.isAdmin}, '', '#'+view); }catch(e){}
  render();
}
window.addEventListener('popstate', (e)=>{
  if(e.state){
    state.view = e.state.view;
    state.activeTemplate = e.state.activeTemplate;
    state.isAdmin = !!e.state.isAdmin;
  } else {
    state.view = 'login';
  }
  render();
});

function hideModules(){
  const plantasRoot = document.getElementById('plantas-app');
  const emergenciasRoot = document.getElementById('emergencias-app');
  const bar = document.getElementById('back-to-launcher-bar');
  if(window.PlantasApp) window.PlantasApp.stop();
  if(window.EmergenciasApp) window.EmergenciasApp.stop();
  if(plantasRoot){ plantasRoot.style.display='none'; plantasRoot.innerHTML=''; }
  if(emergenciasRoot){ emergenciasRoot.style.display='none'; emergenciasRoot.innerHTML=''; }
  if(bar) bar.style.display='none';
}
function showModule(id){
  const plantasRoot = document.getElementById('plantas-app');
  const emergenciasRoot = document.getElementById('emergencias-app');
  const bar = document.getElementById('back-to-launcher-bar');
  if(bar) bar.style.display='block';
  if(id==='plantas'){
    if(window.EmergenciasApp) window.EmergenciasApp.stop();
    if(emergenciasRoot){ emergenciasRoot.style.display='none'; emergenciasRoot.innerHTML=''; }
    if(plantasRoot) plantasRoot.style.display='block';
    window.PlantasApp.start();
  } else {
    if(window.PlantasApp) window.PlantasApp.stop();
    if(plantasRoot){ plantasRoot.style.display='none'; plantasRoot.innerHTML=''; }
    if(emergenciasRoot) emergenciasRoot.style.display='block';
    const tipoMap = {emergencias:'Emergencia', correctivos:'Correctivo'};
    window.EmergenciasApp.start(tipoMap[id] || null);
  }
}
function render(){
  if(state.view==='app'){
    document.getElementById('app').style.display='none';
    showModule(state.activeTemplate);
    return;
  }
  hideModules();
  document.getElementById('app').style.display='';
  const app = document.getElementById('app');
  if(state.view==='loading') app.innerHTML = `<div class="center-wrap">Cargando…</div>`;
  else if(state.view==='login') app.innerHTML = renderLogin();
  else if(state.view==='pending') app.innerHTML = renderPending();
  else if(state.view==='rejected') app.innerHTML = renderRejected();
  else if(state.view==='disabled') app.innerHTML = renderDisabled();
  else if(state.view==='selector') app.innerHTML = renderSelector();
  else if(state.view==='admin-login') app.innerHTML = renderAdminLogin();
  else if(state.view==='admin-panel') app.innerHTML = `<div class="center-wrap" style="align-items:flex-start;"></div>`;
  attachHandlers();
  const btnVolverGlobal = document.getElementById('btn-volver-selector-global');
  if(btnVolverGlobal) btnVolverGlobal.onclick = ()=> go('selector', {activeTemplate:null});
  if(state.view==='admin-panel') renderAdminPanelAsync();
}

function renderLogin(){
  return `<div class="center-wrap"><div class="box">
    ${logoRow()}
    <div class="card">
      <h2>Identifícate para continuar</h2>
      <p class="sub">Ingresa tus datos para solicitar acceso. Un administrador debe autorizarte antes de que puedas usar los formatos.</p>
      <div class="field"><label>Nombres y apellidos</label><input id="li-nombre" placeholder="Ej: Juan Carlos Pérez"></div>
      <div class="field"><label>Número de cédula</label><input id="li-cedula" placeholder="Ej: 1102345678" inputmode="numeric"></div>
      <button class="btn" id="btn-solicitar">Solicitar acceso</button>
      <button class="link-btn" id="btn-admin-link">Soy administrador</button>
      <button class="link-btn" id="btn-master-link">Soy administrador maestro</button>
    </div>
  </div></div>`;
}

function renderPending(){
  return `<div class="center-wrap"><div class="box">
    ${logoRow()}
    <div class="card status-box">
      <div class="big">⏳</div>
      <h2>Solicitud enviada</h2>

async function renderAdminPanelAsync(){
  const idx = await getEntityIndex('usuario');
  idx.sort((a,b)=> new Date(b.solicitadoAt||0)-new Date(a.solicitadoAt||0));
  const pendientes = idx.filter(u=>u.estado==='pendiente');
  const autorizados = idx.filter(u=>u.estado==='autorizado');
  const rechazados = idx.filter(u=>u.estado==='rechazado');
  const enEjecucion = await getRunningFormats();

  function rowHtml(u, actions){
    return `<tr>
      <td>${u.nombre}</td><td>${u.cedula}</td><td><span class="status-pill ${u.estado}">${u.estado}</span></td>
      <td>${actions.map(a=>`<button class="btn small ${a.cls}" data-adminaction="${a.action}:${u.cedula}">${a.label}</button>`).join(' ')}</td>
    </tr>`;
  }

  const html = `
  <div class="topbar">
    <div class="who">Panel de <b>administrador</b></div>
    <div class="actions">
      ${isAdminActive()?`<button class="btn ghost small" id="btn-nav-back">← Atrás</button><button class="btn ghost small" id="btn-nav-fwd">Adelante →</button>`:''}
      <button class="btn ghost small" id="btn-refrescar-admin">🔄 Actualizar</button>
      <button class="btn ghost small" id="btn-salir-admin">Salir</button>
    </div>
  </div>
  <div class="admin-wrap">
    <div class="warn-box">Esta contraseña de administrador es un candado simple, no una autenticación segura — cualquiera con el código fuente puede verla o cambiarla.</div>

    <div class="card">
      <h2 style="border:none;margin:0 0 4px;">📡 Todos los formatos (vista de supervisor)</h2>
      <p class="sub">Todas las órdenes de trabajo registradas, en progreso o finalizadas, en cualquiera de las dos plantillas. Esta visión es la misma para el administrador y para el administrador maestro — solo el maestro puede editar o borrar los ya finalizados dentro del formato.</p>
      ${enEjecucion.length===0?'<div class="empty">Aún no hay formatos registrados.</div>':`
      <table><thead><tr><th>Plantilla</th><th>OT</th><th>Estación</th><th>Estado</th><th>Actualizado</th><th></th></tr></thead><tbody>
      ${enEjecucion.map(e=>`<tr>
        <td><span class="status-pill ${e.tipo==='plantas'?'autorizado':'pendiente'}">${e.tipo==='plantas'?'Plantas Eléctricas':'Emergencias'}</span></td>
        <td>${e.id}</td><td>${e.nombreEstacion||'—'}</td>
        <td><span class="status-pill ${e.status==='en_progreso'?'pendiente':'autorizado'}">${e.status==='en_progreso'?'En progreso':'Finalizado'}</span></td>
        <td>${fmt(e.updatedAt)}</td>
        <td><button class="btn secondary small" data-vertpl="${e.tipo}">Ver →</button></td>
      </tr>`).join('')}
      </tbody></table>`}
    </div>

    <div class="card">
      <h2 style="border:none;margin:0 0 4px;">Autorizar un usuario directamente</h2>
      <p class="sub">Puedes crear el acceso sin esperar a que la persona lo solicite.</p>
      <div class="field"><label>Nombres y apellidos</label><input id="admin-nuevo-nombre"></div>
      <div class="field"><label>Número de cédula</label><input id="admin-nuevo-cedula" inputmode="numeric"></div>
      ${isMasterActive()?`<div class="field"><label>Rol</label><select id="admin-nuevo-rol">
        <option value="tecnico">Técnico</option>
        <option value="administrador">Administrador</option>
      </select></div>`:''}
      <button class="btn" id="btn-admin-crear">+ Autorizar usuario</button>
    </div>

    <div class="subhead">Pendientes de aprobación (${pendientes.length})</div>
    ${pendientes.length===0?'<div class="empty">No hay solicitudes pendientes.</div>':`
    <table><thead><tr><th>Nombre</th><th>Cédula</th><th>Estado</th><th></th></tr></thead><tbody>
    ${pendientes.map(u=>rowHtml(u,[{action:'autorizar',label:'✓ Autorizar',cls:'secondary'},{action:'rechazar',label:'✕ Rechazar',cls:'danger'}])).join('')}
    </tbody></table>`}

    <div class="subhead">Usuarios autorizados (${autorizados.length})</div>
    ${autorizados.length===0?'<div class="empty">Aún no hay usuarios autorizados.</div>':`
    <table><thead><tr><th>Nombre</th><th>Cédula</th><th>Estado</th>${isMasterActive()?'<th>Rol</th>':''}<th></th></tr></thead><tbody>
    ${autorizados.map(u=>{
      if(!isMasterActive()){
        return rowHtml(u,[{action:'revocar',label:'Revocar acceso',cls:'danger'}]);

}

// ---------- EVENTS ----------
function attachHandlers(){
  const btnSolicitar = document.getElementById('btn-solicitar');
  if(btnSolicitar) btnSolicitar.onclick = async ()=>{
    const nombre = document.getElementById('li-nombre').value.trim();
    const cedula = document.getElementById('li-cedula').value.trim();
    if(!nombre || !cedula){ alert('Ingresa tu nombre y tu número de cédula.'); return; }
    localStorage.setItem('miCedula', cedula);
    localStorage.setItem('miNombre', nombre);
    state.miCedula = cedula; state.miNombre = nombre;
    let u = await loadEntity('usuario', cedula);
    if(!u){ u = emptyUsuario(cedula, nombre); await saveEntity('usuario', u); }
    else if(u.nombre !== nombre){ u.nombre = nombre; await saveEntity('usuario', u); }
    state.miEstado = u.estado;
    if(u.estado==='autorizado' && u.activo===false) go('disabled');
    else if(u.estado==='autorizado'){ applyRoleFlags(u); go('selector'); }
    else if(u.estado==='rechazado') go('rejected');
    else go('pending');
  };
  const btnAdminLink = document.getElementById('btn-admin-link');
  if(btnAdminLink) btnAdminLink.onclick = ()=>{ state.adminLoginTarget='admin'; go('admin-login'); };
  const btnMasterLink = document.getElementById('btn-master-link');
  if(btnMasterLink) btnMasterLink.onclick = ()=>{ state.adminLoginTarget='master'; go('admin-login'); };

  const btnRefrescar = document.getElementById('btn-refrescar');
  if(btnRefrescar) btnRefrescar.onclick = ()=> bootstrap();
  const btnCambiarUsuario = document.getElementById('btn-cambiar-usuario');
  if(btnCambiarUsuario) btnCambiarUsuario.onclick = ()=>{
    localStorage.removeItem('miCedula'); localStorage.removeItem('miNombre');
    localStorage.removeItem('adminActive'); localStorage.removeItem('masterAdmin');
    state.miCedula=''; state.miNombre=''; state.isAdmin=false; go('login');
  };

  document.querySelectorAll('[data-opentpl]').forEach(c=> c.onclick = ()=>{ go('app', {activeTemplate: c.dataset.opentpl}); });
  const btnBackSelector = document.getElementById('btn-back-selector');
  if(btnBackSelector) btnBackSelector.onclick = ()=>{ go('selector', {activeTemplate:null}); };
  const btnLogout = document.getElementById('btn-logout');
  if(btnLogout) btnLogout.onclick = ()=>{
    localStorage.removeItem('miCedula'); localStorage.removeItem('miNombre');
    localStorage.removeItem('adminActive'); localStorage.removeItem('masterAdmin');
    state.miCedula=''; state.miNombre=''; state.isAdmin=false; go('login');
  };
  const btnPanelDesdeSelector = document.getElementById('btn-panel-desde-selector');
  if(btnPanelDesdeSelector) btnPanelDesdeSelector.onclick = ()=>{ state.isAdmin=true; go('admin-panel'); };
  const btnNavBack = document.getElementById('btn-nav-back');
  if(btnNavBack) btnNavBack.onclick = ()=> history.back();
  const btnNavFwd = document.getElementById('btn-nav-fwd');
  if(btnNavFwd) btnNavFwd.onclick = ()=> history.forward();
  const btnSalirMaster = document.getElementById('btn-salir-master');
  if(btnSalirMaster) btnSalirMaster.onclick = ()=>{
    if(!confirm('¿Salir del modo administrador maestro? Perderás el permiso de editar o borrar formatos finalizados hasta que vuelvas a entrar con la contraseña maestra.')) return;
    localStorage.removeItem('masterAdmin'); localStorage.removeItem('adminActive'); state.isAdmin=false; go('login');
  };
  const btnSalirAdminVision = document.getElementById('btn-salir-admin-vision');
  if(btnSalirAdminVision) btnSalirAdminVision.onclick = ()=>{
    localStorage.removeItem('adminActive'); state.isAdmin=false; go('login');
  };

  const btnAdminEntrar = document.getElementById('btn-admin-entrar');
  if(btnAdminEntrar) btnAdminEntrar.onclick = ()=>{
    const pass = document.getElementById('admin-pass').value;
    if(state.adminLoginTarget==='master'){
      if(pass===MASTER_ADMIN_PASSWORD){ localStorage.setItem('masterAdmin','1'); state.isAdmin=true; go('selector'); }
      else alert('Contraseña incorrecta.');
    } else {
      if(pass===ADMIN_PASSWORD){ localStorage.removeItem('masterAdmin'); localStorage.setItem('adminActive','1'); state.isAdmin=true; go('selector'); }
      else alert('Contraseña incorrecta.');
    }
  };
  const btnVolverLogin = document.getElementById('btn-volver-login');
  if(btnVolverLogin) btnVolverLogin.onclick = ()=>{ go('login'); };
}

function attachAdminHandlers(){
  const btnSalirAdmin = document.getElementById('btn-salir-admin');
  if(btnSalirAdmin) btnSalirAdmin.onclick = ()=>{ state.isAdmin=false; go('login'); };
  const btnRefrescarAdmin = document.getElementById('btn-refrescar-admin');
  if(btnRefrescarAdmin) btnRefrescarAdmin.onclick = ()=> renderAdminPanelAsync();
  const btnNavBackAdmin = document.getElementById('btn-nav-back');
  if(btnNavBackAdmin) btnNavBackAdmin.onclick = ()=> history.back();
  const btnNavFwdAdmin = document.getElementById('btn-nav-fwd');
  if(btnNavFwdAdmin) btnNavFwdAdmin.onclick = ()=> history.forward();
  document.querySelectorAll('[data-vertpl]').forEach(b=>{
    b.onclick = ()=>{ go('app', {activeTemplate: b.dataset.vertpl}); };
  });
  const btnCrear = document.getElementById('btn-admin-crear');
  if(btnCrear) btnCrear.onclick = async ()=>{
    const nombre = document.getElementById('admin-nuevo-nombre').value.trim();
    const cedula = document.getElementById('admin-nuevo-cedula').value.trim();
    if(!nombre || !cedula){ alert('Ingresa nombre y cédula.'); return; }
    const u = await loadEntity('usuario', cedula) || emptyUsuario(cedula, nombre);
    u.nombre = nombre; u.estado = 'autorizado'; u.autorizadoAt = nowIso();
    const rolSelect = document.getElementById('admin-nuevo-rol');
    if(rolSelect) u.rol = rolSelect.value;
    await saveEntity('usuario', u);
    renderAdminPanelAsync();
  };
  document.querySelectorAll('[data-adminaction]').forEach(b=>{
    b.onclick = async ()=>{
      const [action, cedula] = b.dataset.adminaction.split(':');
      const u = await loadEntity('usuario', cedula);
      if(!u) return;
      if(action==='autorizar'){ u.estado='autorizado'; u.autorizadoAt=nowIso(); }
      else if(action==='rechazar'){ u.estado='rechazado'; }
      else if(action==='revocar'){ u.estado='rechazado'; }
      else if(action==='habilitar'){ u.activo = true; }
      else if(action==='deshabilitar'){ u.activo = false; }
      await saveEntity('usuario', u);
      renderAdminPanelAsync();
    };
  });
  document.querySelectorAll('[data-rolchange]').forEach(sel=>{
    sel.onchange = async ()=>{
      const cedula = sel.dataset.rolchange;
      const u = await loadEntity('usuario', cedula);
      if(!u) return;
      u.rol = sel.value;
      await saveEntity('usuario', u);
      renderAdminPanelAsync();
    };
  });
}

bootstrap();
})();
</script>

}
// ---------- base de datos de sitios (nombre + coordenadas) para validar cercanía ----------
const SITIO_DIST_MAX_M = 800;
let SITIOS_DB = [];
let SITIOS_DB_LOADED = false;

function normalizeName(s){
  return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
async function loadSitiosDB(){
  try{
    const r = await window.storage.get('plantas-sitios-db', true);
    SITIOS_DB = r ? JSON.parse(r.value) : [];
  }catch(e){ SITIOS_DB = []; }
  SITIOS_DB_LOADED = true;
}
async function saveSitiosDB(list){
  SITIOS_DB = list;
  await window.storage.set('plantas-sitios-db', JSON.stringify(list), true);
}
function distanceMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function findSitioByNombre(nombre){
  const n = normalizeName(nombre);
  if(!n) return null;
  return SITIOS_DB.find(s => normalizeName(s.nombre) === n) || null;
}
function getUbicacionValidacion(sess){
  if(!SITIOS_DB.length) return {estado:'sin-db'};
  const nombre = (sess.general.nombreEstacion||'').trim();
  if(!nombre) return {estado:'sin-nombre'};
  const sitio = findSitioByNombre(nombre);
  if(!sitio) return {estado:'no-encontrado'};
  const ubics = sess.ubicaciones||[];
  if(!ubics.length) return {estado:'sin-gps', sitio};
  const last = ubics[ubics.length-1];
  if(last.lat==null || last.lng==null) return {estado:'sin-gps', sitio};
  const dist = distanceMeters(last.lat, last.lng, sitio.lat, sitio.lng);
  if(dist > SITIO_DIST_MAX_M) return {estado:'bloqueado', sitio, dist};
  return {estado:'ok', sitio, dist};
}

// ---------- GEOLOCATION ----------
function captureLocation(sess, tipo){
  if(!navigator.geolocation){
    sess.ubicaciones.push({lat:null,lng:null,timestamp:nowIso(),tipo,error:"Geolocalización no disponible en este navegador"});
    saveSessionSafe(sess); if(state.currentSession===sess) render();
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    sess.ubicaciones.push({lat:pos.coords.latitude,lng:pos.coords.longitude,timestamp:nowIso(),tipo});
    await saveSessionSafe(sess);
    if(state.currentSession===sess) render();
  }, async (err)=>{
    sess.ubicaciones.push({lat:null,lng:null,timestamp:nowIso(),tipo,error:err.message||"Permiso de ubicación denegado"});
    await saveSessionSafe(sess);
    if(state.currentSession===sess) render();
  }, {enableHighAccuracy:true, timeout:15000});
}
function startLocationLoop(sess){
  stopLocationLoop();
  captureLocation(sess,"inicial");
  state.locTimer = setInterval(()=>{
    if(state.currentSession && state.currentSession.status==="en_progreso"){ captureLocation(state.currentSession,"periodica"); }
  }, LOC_INTERVAL_MS);
}
function stopLocationLoop(){ if(state.locTimer){ clearInterval(state.locTimer); state.locTimer=null; } }

// ---------- photo capture / compression ----------
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>=h){ if(w>PHOTO_MAX_DIM){ h = Math.round(h*PHOTO_MAX_DIM/w); w = PHOTO_MAX_DIM; } }
        else { if(h>PHOTO_MAX_DIM){ w = Math.round(w*PHOTO_MAX_DIM/h); h = PHOTO_MAX_DIM; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', PHOTO_QUALITY));
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

function textField(labelTxt, path, value, readonly){
  return `<div class="field"><label>${labelTxt}</label><input data-field="${path}" value="${(value||'').toString().replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>`;
}
function rowCardTransporte(t, i, readonly){
  return `<div class="row-card">
    <div class="row-card-head"><span class="idx">TRANSPORTE #${i+1}</span>${!readonly?`<button class="row-del" data-delrow="transporte|${t.id}">Eliminar</button>`:''}</div>
    <div class="grid">
      <div class="field"><label>Distancia en KM</label><input data-rowfield="transporte|${t.id}|distanciaKm" value="${(t.distanciaKm||'').replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>
      <div class="field"><label>Tiempo de desplazamiento</label><input data-rowfield="transporte|${t.id}|tiempo" value="${(t.tiempo||'').replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>
      <div class="field"><label>Tipo de transporte</label><input data-rowfield="transporte|${t.id}|tipo" value="${(t.tipo||'').replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>

function renderLocationPanel(sess, readonly){
  const lastLoc = sess.ubicaciones.length ? sess.ubicaciones[sess.ubicaciones.length-1] : null;
  const log = sess.ubicaciones.slice().reverse().map(u=>{
    if(u.lat) return `<div>📍 <a href="${mapLink(u.lat,u.lng)}" target="_blank">${u.lat.toFixed(5)}, ${u.lng.toFixed(5)}</a> — ${fmt(u.timestamp)} <i>(${u.tipo})</i></div>`;
    return `<div>⚠️ Error de ubicación (${u.tipo}) — ${fmt(u.timestamp)}: ${u.error||''}</div>`;
  }).join('') || '<div style="color:var(--muted);">Aún no hay registros de ubicación.</div>';

  let actions = '';
  if(!readonly){
    actions = `<div class="row-actions" style="margin-top:8px;">
      <button class="btn secondary small" id="btn-gps-auto">📍 Generar ubicación GPS ahora</button>
    </div>
    <div class="manual-loc">
      <div class="field"><label>Latitud (manual)</label><input id="manual-lat" placeholder="Ej: 10.41234"></div>
      <div class="field"><label>Longitud (manual)</label><input id="manual-lng" placeholder="Ej: -75.12345"></div>
      <button class="btn ghost small" id="btn-gps-manual">➕ Pegar ubicación manual</button>
    </div>`;
  }

  return `<div class="card"><h2>📍 Ubicación GPS del mantenimiento</h2>
    <div class="loc-panel">
      <div>Última ubicación: ${lastLoc ? (lastLoc.lat? `<a href="${mapLink(lastLoc.lat,lastLoc.lng)}" target="_blank">${lastLoc.lat.toFixed(5)}, ${lastLoc.lng.toFixed(5)}</a> (${fmt(lastLoc.timestamp)}, ${lastLoc.tipo})` : `error — ${fmt(lastLoc.timestamp)}`) : 'aún sin registrar'}</div>
      ${actions}
      <div class="loc-log">${log}</div>
    </div>
  </div>`;
}

function renderSitioCheck(sess){
  if(!sess) return `<div class="card"><div class="empty">Sesión no encontrada.</div></div>`;
  const nombre = sess.general.nombreEstacion || '';
  const val = getUbicacionValidacion(sess);
  const bloqueado = val.estado === 'bloqueado';
  const puedeContinuar = nombre.trim().length>0 && !bloqueado;

  let statusHtml = '';
  if(!nombre.trim()){
    statusHtml = `<p class="hint" style="margin:0;">Escribe el nombre del sitio para validar tu ubicación.</p>`;
  } else if(val.estado==='sin-db'){
    statusHtml = `<p class="hint" style="margin:0;">No hay una base de datos de sitios cargada — se puede continuar sin validar la ubicación.</p>`;
  } else if(val.estado==='no-encontrado'){
    statusHtml = `<div class="card" style="border-color:#e0a800;background:#fff8e8;margin:10px 0 0;"><p class="hint" style="margin:0;color:#7a5c00;">⚠️ "${nombre}" no se encontró en la base de datos de sitios — no se puede validar la ubicación, pero puedes continuar.</p></div>`;
  } else if(val.estado==='sin-gps'){
    statusHtml = `<div class="card" style="border-color:#e0a800;background:#fff8e8;margin:10px 0 0;"><p class="hint" style="margin:0;color:#7a5c00;">⏳ Buscando tu ubicación GPS para validar la distancia al sitio "${val.sitio.nombre}"...</p></div>`;
  } else if(val.estado==='ok'){
    statusHtml = `<div class="card" style="border-color:#1e8a4c;background:#e5f6ea;margin:10px 0 0;"><p class="hint" style="margin:0;color:#1e8a4c;">✅ Ubicación validada — estás a ${Math.round(val.dist)} m del sitio "${val.sitio.nombre}" (máximo permitido: ${SITIO_DIST_MAX_M} m). Puedes continuar.</p></div>`;
  } else if(bloqueado){
    statusHtml = `<div class="card" style="border:2px solid var(--bad);background:#fbe7e6;margin:10px 0 0;">
      <h2 style="border:none;color:var(--bad);margin:0 0 6px;">🚫 No puedes continuar todavía</h2>
      <p style="margin:0 0 4px;color:#7a1410;font-size:13px;">Estás a <b>${Math.round(val.dist)} m</b> del sitio "<b>${val.sitio.nombre}</b>" registrado en la base de datos (máximo permitido: ${SITIO_DIST_MAX_M} m).</p>
      <p style="margin:0;color:#7a1410;font-size:13px;">Verifica que el nombre esté bien escrito, o acércate a la ubicación correcta. Esta pantalla se revisa sola cada vez que el GPS actualiza tu posición.</p>
    </div>`;
  }

  return `<div class="card">
    <h2>OT ${sess.id} — Nombre del sitio</h2>
    <p class="hint">Ingresa el nombre del sitio o estación base. Si está en la base de datos, se comparará tu ubicación GPS actual contra las coordenadas registradas antes de dejarte continuar con el resto del formulario.</p>
    <div class="field"><label>Nombre del sitio / estación base</label>
      <input id="sitio-nombre-input" placeholder="Ej: Suc.sehebe" value="${nombre.replace(/"/g,'&quot;')}">
    </div>
    ${statusHtml}
  </div>
  ${renderLocationPanel(sess, false)}
  <div class="row-actions">
    <button class="btn" id="btn-continuar-sitio" ${puedeContinuar?'':'disabled'}>Continuar al formulario →</button>
    <button class="btn ghost" data-nav="home">← Volver al inicio</button>
  </div>`;
}

    groups.push({
      title: sec.title,
      items: sec.items.map((item,i)=>{
        const e = sess.checklist[sec.key][i];
        return {caption:item, dataUrl:e.foto||null};
      })
    });
  });
  groups.push({title:'4. Prueba realizada', items: PRUEBAS_ITEMS.map((item,i)=>{ const e=sess.pruebas[i]; return {caption:item, dataUrl:e.foto||null}; })});
  groups.push({title:'5. Servicio de filtración', items: FILTRACION_ITEMS.map((item,i)=>{ const e=sess.filtracion[i]; return {caption:item, dataUrl:e.foto||null}; })});
  if((sess.hallazgosFotos||[]).length) groups.push({title:'Fotos generales de hallazgos', items: sess.hallazgosFotos.map((f,i)=>({caption:`Foto de hallazgo ${i+1}`, dataUrl:f.foto||null}))});
  if((sess.hallazgosDetalle||[]).length) groups.push({title:'Registro fotográfico de hallazgos', items: sess.hallazgosDetalle.map((h,i)=>({caption:`Hallazgo ${i+1} — ${h.sistema||'s/n'}`, dataUrl:h.foto||null}))});
  if((sess.transporte||[]).length) groups.push({title:'Foto transporte especial', items: sess.transporte.map((t,i)=>({caption:`Transporte ${i+1} — ${t.tipo||'s/n'}`, dataUrl:t.foto||null}))});
  return groups;
}

// ---------- EXPORT: PDF ----------
function drawInfoGrid(doc, startX, startY, pairs, colWidth, rowH, cols){
  cols = cols || 3;
  let x=startX, y=startY, col=0;
  pairs.forEach(([label,value])=>{
    doc.setDrawColor(215,213,206);
    doc.rect(x, y, colWidth, rowH);
    doc.setFontSize(6.5); doc.setTextColor(100,100,100); doc.setFont(undefined,'normal');
    const labelText = String(label).toUpperCase()+':';
    doc.text(labelText, x+2, y+rowH/2+1.3);
    const labelW = doc.getTextWidth(labelText);
    doc.setFontSize(8); doc.setTextColor(20,20,20); doc.setFont(undefined,'bold');
    const val = doc.splitTextToSize(String(value===undefined||value===null||value===''?'—':value), colWidth-6-labelW).slice(0,2);
    doc.text(val, x+3+labelW, y+rowH/2+1.3);
    doc.setFont(undefined,'normal');
    col++;
    if(col>=cols){ col=0; x=startX; y+=rowH; } else { x+=colWidth; }
  });
  if(col!==0) y+=rowH;
  return y;
}
function sectionBar(doc, x, y, w, title){
  doc.setFillColor(227,6,19);
  doc.roundedRect(x, y, w, 6, 1.2, 1.2, 'F');
  doc.setFontSize(9); doc.setTextColor(255,255,255); doc.setFont(undefined,'bold');
  doc.text(title, x+2, y+4.2);
  doc.setFont(undefined,'normal');
  return y+6+3;
}
function addHeaderFooter(doc){
  const total = doc.internal.getNumberOfPages();
  const genDate = new Date().toLocaleString('es-CO');
  for(let i=1;i<=total;i++){
    doc.setPage(i);
    if(i===1) continue; // la página 1 ya tiene su propio encabezado rojo
    doc.setFontSize(7.5); doc.setTextColor(130,130,130);
    doc.text(`CLARO COSTA | SMU - Mantenimiento Preventivo Plantas Eléctricas | Generado: ${genDate}`, 14, 8);
    doc.text(`Pág. ${i}`, 196, 8, {align:'right'});
  }
}

  y += 6;

    });

  addHeaderFooter(doc);
  doc.save(`Mantenimiento_${sess.id}.pdf`);

function wrapText(doc, text, x, y, maxWidth){
  const lines = doc.splitTextToSize(text, maxWidth);
  lines.forEach((line,i)=>{
    if(y> 285){ doc.addPage(); y=15; }
    doc.text(line, x, y+ (i*4.2));
  });
  return y + lines.length*4.2;
}


// ---------- EVENTS ----------
function setPath(obj, path, val){
  const parts = path.split('.'); let o = obj;
  for(let i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = val;
}
let saveDebounce=null;
function debouncedSave(){
  if(saveDebounce) clearTimeout(saveDebounce);
  saveDebounce = setTimeout(()=>{ saveSessionSafe(state.currentSession); }, 500);
}

async function handleDownload(id, type){
  const sess = await loadSession(id);
  if(!sess){ alert('No se encontró ese formato.'); return; }
  generatePDF(sess);
}
async function handleDelete(id){
  if(!isMasterAdmin()){ alert('Solo el administrador maestro puede borrar formatos.'); render(); return; }
  if(!confirm(`¿Eliminar permanentemente el formato ${id}? Esta acción no se puede deshacer.`)) return;
  await deleteSessionEverywhere(id);
  render();
}

function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = ()=>{ stopLocationLoop(); stopLiveRefresh(); state.view = b.dataset.nav; render(); };
  });

  const btnCrearOt = document.getElementById('btn-crear-ot');
  if(btnCrearOt) btnCrearOt.onclick = async ()=>{
    if(isAdminOnlyMode()){ alert('Como administrador no tienes permiso para crear nuevos formatos.'); return; }
    const otVal = document.getElementById('ot-input').value.trim();
    state.currentSession = emptySession(otVal);
    state.view = "sitio-check";
    render();
    await saveSessionSafe(state.currentSession);
    startLocationLoop(state.currentSession);
  };

  const sitioNombreInput = document.getElementById('sitio-nombre-input');
  if(sitioNombreInput){
    sitioNombreInput.oninput = ()=>{ state.currentSession.general.nombreEstacion = sitioNombreInput.value; debouncedSave(); };
    sitioNombreInput.onblur = async ()=>{ await saveSessionSafe(state.currentSession); render(); };
  }
  const btnContinuarSitio = document.getElementById('btn-continuar-sitio');
  if(btnContinuarSitio) btnContinuarSitio.onclick = ()=>{
    const val = getUbicacionValidacion(state.currentSession);
    if(val.estado==='bloqueado'){ alert('Todavía estás fuera del rango permitido de ese sitio.'); return; }
    if(!(state.currentSession.general.nombreEstacion||'').trim()){ alert('Escribe el nombre del sitio para continuar.'); return; }
    state.view = "form";
    render();
  };

  document.querySelectorAll('[data-open]').forEach(r=>{
    r.onclick = async ()=>{
      const sess = await loadSession(r.dataset.open);
      if(!sess) return;
      if(sess.status==='en_progreso' || isMasterAdmin()){
        state.currentSession = sess; state.view = "form"; render();
        if(sess.status==='en_progreso') startLocationLoop(sess);
      } else {
        state.viewedSession = sess; state.view = "viewsession"; render();
      }
    };
  });

  document.querySelectorAll('[data-watch]').forEach(r=>{
    r.onclick = async ()=>{
      state.viewerId = r.dataset.watch;
      state.viewedSession = await loadSession(state.viewerId);
      state.view = "viewsession"; render(); startLiveRefresh();
    };
  });

  document.querySelectorAll('[data-pdf]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); handleDownload(b.dataset.pdf,'pdf'); });
  document.querySelectorAll('[data-delete]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); handleDelete(b.dataset.delete); });

  document.querySelectorAll('input[data-field], textarea[data-field]').forEach(inp=>{
    inp.oninput = ()=>{ setPath(state.currentSession, inp.dataset.field, inp.value); debouncedSave(); };
  });
  const nombreEstacionInput = document.querySelector('input[data-field="general.nombreEstacion"]');
  if(nombreEstacionInput) nombreEstacionInput.onblur = async ()=>{ await saveSessionSafe(state.currentSession); render(); };
  document.querySelectorAll('select[data-field]').forEach(sel=>{
    sel.onchange = async ()=>{
      setPath(state.currentSession, sel.dataset.field, sel.value);
      await saveSessionSafe(state.currentSession);
      render();
    };
  });

  document.querySelectorAll('[data-hrowfield]').forEach(inp=>{
    const isSelect = inp.tagName==='SELECT';
    const evt = isSelect ? 'onchange' : 'oninput';
    inp[evt] = async ()=>{
      const [rowId, field] = inp.dataset.hrowfield.split('|');
      const row = (state.currentSession.hallazgosDetalle||[]).find(r=>r.id===rowId);
      if(row){
        row[field] = inp.value;
        if(isSelect){ await saveSessionSafe(state.currentSession); render(); }
        else debouncedSave();
      }
    };
  });
  document.querySelectorAll('[data-addhallazgorow]').forEach(b=>{

      if(!s[arrName]) s[arrName] = [];
      if(arrName==='hallazgosFotos') s[arrName].push({id:rid(), foto:null});
      else s[arrName].push({id:rid(), sistema:"", prioridad:"Media", descripcion:"", resuelto:"", foto:null});
      await saveSessionSafe(s);
      render();
    };
  });
  document.querySelectorAll('[data-delhallazgorow]').forEach(b=>{
    b.onclick = async ()=>{
      const [arrName, rowId] = b.dataset.delhallazgorow.split('|');
      state.currentSession[arrName] = (state.currentSession[arrName]||[]).filter(r=>r.id!==rowId);
      await saveSessionSafe(state.currentSession);
      render();
    };
  });

  document.querySelectorAll('[data-rowfield]').forEach(inp=>{
    const isSelect = inp.tagName==='SELECT';
    const evt = isSelect ? 'onchange' : 'oninput';
    inp[evt] = async ()=>{
      const [arrName, rowId, field] = inp.dataset.rowfield.split('|');
      const row = (state.currentSession[arrName]||[]).find(r=>r.id===rowId);
      if(row){
        row[field] = inp.value;
        if(isSelect){ await saveSessionSafe(state.currentSession); render(); }
        else debouncedSave();
      }
    };
  });
  document.querySelectorAll('[data-addrow]').forEach(b=>{
    b.onclick = async ()=>{
      const arrName = b.dataset.addrow;
      state.currentSession[arrName] = state.currentSession[arrName] || [];
      state.currentSession[arrName].push(ROW_TEMPLATES[arrName]());
      await saveSessionSafe(state.currentSession);
      render();
    };
  });
  document.querySelectorAll('[data-delrow]').forEach(b=>{
    b.onclick = async ()=>{
      const [arrName, rowId] = b.dataset.delrow.split('|');
      state.currentSession[arrName] = (state.currentSession[arrName]||[]).filter(r=>r.id!==rowId);
      await saveSessionSafe(state.currentSession);
      render();
    };
  });

  const btnAddVideo = document.getElementById('btn-add-video');

  const videoInput = document.getElementById('video-input');
  if(videoInput) videoInput.onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('video/')){ alert('Selecciona un archivo de video.'); e.target.value=''; return; }
    const sizeMB = file.size/1024/1024;
    if(sizeMB > VIDEO_MAX_MB){ alert(`El video pesa ${sizeMB.toFixed(1)} MB y el máximo permitido es ${VIDEO_MAX_MB} MB. Elige un archivo más liviano.`); e.target.value=''; return; }
    if((state.currentSession.videos||[]).length>=4){ alert('Ya alcanzaste el máximo de 4 videos.'); return; }
    const reader = new FileReader();
    reader.onload = async ()=>{
      const dataUrl = reader.result;
      const vid = {id: rid(), nombre: file.name, sizeMB: sizeMB.toFixed(1)};
      await saveVideoData(state.currentSession.id, vid.id, dataUrl);
      state.currentSession.videos = state.currentSession.videos || [];
      state.currentSession.videos.push(vid);
      await saveSessionSafe(state.currentSession);
      render();
    };
    reader.onerror = ()=> alert('No se pudo leer el video, intenta de nuevo.');

  };

    b.onclick = async ()=>{
      if(!confirm('¿Eliminar este video?')) return;
      const vidId = b.dataset.delvideo;

      sess.videos = (sess.videos||[]).filter(v=>v.id!==vidId);
      await deleteVideoData(sess.id, vidId);
      await saveSessionSafe(sess);
      render();
    };
  });
  document.querySelectorAll('[data-video-src]').forEach((el)=>{
    const vidId = el.dataset.videoSrc;
    const sess = activeSession();
    if(!sess) return;
    loadVideoData(sess.id, vidId).then(data=>{ if(data) el.src = data; });
  });

  const btnUploadSitios = document.getElementById('btn-upload-sitios');
  if(btnUploadSitios) btnUploadSitios.onclick = ()=>{ const inp = document.getElementById('sitios-file-input'); if(inp) inp.click(); };
  const sitiosFileInput = document.getElementById('sitios-file-input');
  if(sitiosFileInput) sitiosFileInput.onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const firstSheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, {defval:''});
      if(!rows.length){ alert('El archivo no tiene filas de datos.'); e.target.value=''; return; }
      const headers = Object.keys(rows[0]);
      const findCol = (needle)=> headers.find(h=> String(h).toLowerCase().includes(needle));
      const colNombre = headers[0]; // la columna A siempre es el nombre del sitio
      const colLat = findCol('lat');
      const colLng = findCol('lon') || findCol('lng');
      if(!colNombre || !colLat || !colLng){
        alert('No se encontró la columna A (nombre) o las columnas de latitud/longitud. Revisa el archivo.');
        e.target.value=''; return;
      }
      const parsed = rows.map(r=>({
        nombre: String(r[colNombre]||'').trim(),
        lat: parseFloat(r[colLat]),
        lng: parseFloat(r[colLng]),
      })).filter(s=> s.nombre && !isNaN(s.lat) && !isNaN(s.lng));
      if(!parsed.length){ alert('No se pudo leer ningún sitio válido del archivo.'); e.target.value=''; return; }
      await saveSitiosDB(parsed);
      alert(`Se cargaron ${parsed.length} sitios correctamente.`);
      render();
    }catch(err){
      console.error(err);
      alert('No se pudo leer el archivo. Verifica que sea un Excel (.xlsx) o CSV válido.');
    }
    e.target.value='';
  };
  const btnClearSitios = document.getElementById('btn-clear-sitios');
  if(btnClearSitios) btnClearSitios.onclick = async ()=>{
    if(!confirm('¿Borrar toda la base de datos de sitios? Ya no se podrá validar la ubicación de los técnicos hasta subir una nueva.')) return;
    await saveSitiosDB([]);
    render();
  };

  document.querySelectorAll('select.estado-select[data-sec]').forEach(sel=>{
    sel.onchange = ()=>{
      const sec = sel.dataset.sec, idx = sel.dataset.idx;
      const arr = arrForSec(sec);
      arr[idx].estado = sel.value; sel.dataset.val = sel.value;
      const extra = document.querySelector(`[data-extra="${sec}:${idx}"]`);
      if(extra) extra.classList.toggle('show', sel.value!=='BUENO');
      debouncedSave();
    };
  });

  document.querySelectorAll('input[data-filtobs]').forEach(inp=>{
    inp.oninput = ()=>{ state.currentSession.filtracion[inp.dataset.filtobs].observacion = inp.value; debouncedSave(); };
  });

  document.querySelectorAll('textarea[data-field="causa"], textarea[data-field="deteccion"], textarea[data-field="correccion"]').forEach(ta=>{
    ta.oninput = ()=>{
      const wrap = ta.closest('[data-extra]');
      const [sec, idx] = wrap.dataset.extra.split(':');
      arrForSec(sec)[idx][ta.dataset.field] = ta.value;
      debouncedSave();
    };
  });

  document.querySelectorAll('[data-toggle]').forEach(t=>{
    t.onclick = ()=>{
      const body = document.getElementById(t.dataset.toggle);
      body.classList.toggle('show');
      t.querySelector('.chevron').classList.toggle('open');
    };
  });

  const btnFin = document.getElementById('btn-finalizar');
  if(btnFin) btnFin.onclick = async ()=>{
    if(!confirm('¿Finalizar este mantenimiento? Ya no se pedirá más ubicación automática.')) return;
    state.currentSession.status = 'finalizado';
    state.currentSession.general.fechaFin = nowIso();
    state.currentSession.firma.fechaElaboracion = nowIso();
    await saveSessionSafe(state.currentSession);
    stopLocationLoop();
    state.view = 'finalizado';
    render();
  };

  const btnGpsAuto = document.getElementById('btn-gps-auto');
  if(btnGpsAuto) btnGpsAuto.onclick = ()=> captureLocation(state.currentSession, 'manual');

  const btnGpsManual = document.getElementById('btn-gps-manual');
  if(btnGpsManual) btnGpsManual.onclick = async ()=>{
    const lat = parseFloat(document.getElementById('manual-lat').value);
    const lng = parseFloat(document.getElementById('manual-lng').value);
    if(isNaN(lat) || isNaN(lng)){ alert('Ingresa latitud y longitud válidas.'); return; }
    state.currentSession.ubicaciones.push({lat, lng, timestamp:nowIso(), tipo:'pegada manualmente'});
    await saveSessionSafe(state.currentSession);
    render();
  };

  const btnDlPdf = document.getElementById('btn-dl-pdf');
  if(btnDlPdf) btnDlPdf.onclick = ()=> generatePDF(state.currentSession);
  const btnDeleteCurrent = document.getElementById('btn-delete-current');
  if(btnDeleteCurrent) btnDeleteCurrent.onclick = async ()=>{ await handleDelete(state.currentSession.id); state.view = 'historial'; render(); };

  const btnOtroFormato = document.getElementById('btn-otro-formato');
  if(btnOtroFormato) btnOtroFormato.onclick = ()=>{ state.view = 'nuevo'; render(); };
  const btnVerHistorial = document.getElementById('btn-ver-historial');
  if(btnVerHistorial) btnVerHistorial.onclick = ()=>{ state.view = 'historial'; render(); };

  const btnVolver = document.getElementById('btn-volver');
  if(btnVolver) btnVolver.onclick = ()=>{ stopLiveRefresh(); stopLocationLoop(); state.view = 'home'; render(); };
}

// ---------- delegated photo handlers (bound once) ----------
function setupPhotoDelegation(){
  const app = document.getElementById('plantas-app');

  app.addEventListener('click', (e)=>{
    const camBtn = e.target.closest('[data-cam]');
    if(camBtn){
      const input = camBtn.parentElement.querySelector('.photo-input');
      input.setAttribute('capture','environment');
      input.click();
      return;
    }
    const galBtn = e.target.closest('[data-gal]');
    if(galBtn){
      const input = galBtn.parentElement.querySelector('.photo-input');
      input.removeAttribute('capture');
      input.click();
      return;
    }
    const delBtn = e.target.closest('[data-delphoto]');
    if(delBtn){
      const key = delBtn.dataset.delphoto;
      if(!confirm('¿Eliminar esta foto?')) return;
      if(key.indexOf('|')>=0){
        const [arrName, rowId] = key.split('|');
        const s = activeSession();
        const row = s && (s[arrName]||[]).find(r=>r.id===rowId);
        if(!row) return;
        row.foto = null;
        saveSessionSafe(state.currentSession);
        const cell = document.querySelector(`[data-photo-cell="${key}"]`);
        if(cell) cell.innerHTML = photoCellHtml(key, row, false);
        return;
      }
      const [sec, idx] = key.split(':');
      const arr = arrForSec(sec);
      if(!arr) return;
      arr[idx].foto = null;
      saveSessionSafe(state.currentSession);
      const cell = document.querySelector(`[data-photo-cell="${key}"]`);
      if(cell) cell.innerHTML = photoCellHtml(key, arr[idx], false);
      return;
    }
    const enlarge = e.target.closest('[data-enlarge]');
    if(enlarge){
      const key = enlarge.dataset.enlarge;
      if(key.indexOf('|')>=0){
        const [arrName, rowId] = key.split('|');
        const s = activeSession();
        const row = s && (s[arrName]||[]).find(r=>r.id===rowId);
        if(row && row.foto) openPhotoModal(row.foto, arrName==='hallazgosFotos'?'Foto general de hallazgo':'Foto de hallazgo');
        return;
      }
      const [sec, idxStr] = key.split(':'); const idx = parseInt(idxStr,10);
      const arr = arrForSec(sec);
      const entry = arr ? arr[idx] : null;
      if(entry && entry.foto) openPhotoModal(entry.foto, labelForKey(key));
      return;
    }
  });

  app.addEventListener('change', async (e)=>{
    const input = e.target.closest('.photo-input');
    if(input && input.files && input.files[0]){
      const key = input.dataset.key;
      const file = input.files[0];
      try{
        const dataUrl = await compressImage(file);
        if(key.indexOf('|')>=0){
          const [arrName, rowId] = key.split('|');
          const s = activeSession();
          const row = s && (s[arrName]||[]).find(r=>r.id===rowId);
          if(row){
            row.foto = dataUrl;
            const ok = await saveSessionSafe(state.currentSession);
            const cell = document.querySelector(`[data-photo-cell="${key}"]`);
            if(cell) cell.innerHTML = photoCellHtml(key, row, false);
            if(!ok) alert('La foto se agregó pero no se pudo guardar (el formato podría ser muy pesado). Considera eliminar alguna foto anterior.');
          }
        } else {
          const [sec, idx] = key.split(':');
          const arr = arrForSec(sec);
          arr[idx].foto = dataUrl;
          const ok = await saveSessionSafe(state.currentSession);
          const cell = document.querySelector(`[data-photo-cell="${key}"]`);
          if(cell) cell.innerHTML = photoCellHtml(key, arr[idx], false);
          if(!ok) alert('La foto se agregó pero no se pudo guardar (el formato podría ser muy pesado). Considera eliminar alguna foto anterior.');
        }
      }catch(err){
        alert('No se pudo procesar la foto: ' + err.message);
      }
      input.value = '';
    }
  });

  document.getElementById('photo-modal-close').onclick = closePhotoModal;
  document.getElementById('photo-modal').onclick = (e)=>{ if(e.target.id==='photo-modal') closePhotoModal(); };
}
function openPhotoModal(src, caption){
  document.getElementById('photo-modal-img').src = src;
  document.getElementById('photo-modal-caption').textContent = caption;
  document.getElementById('photo-modal').classList.add('show');
}
function closePhotoModal(){ document.getElementById('photo-modal').classList.remove('show'); }

function startLiveRefresh(){
  stopLiveRefresh();
  state.liveTimer = setInterval(async ()=>{
    if(state.view==='viewsession' && state.viewerId){
      const fresh = await loadSession(state.viewerId);
      if(fresh){ state.viewedSession = fresh; render(); } else { state.view='supervisor'; render(); }
    }
  }, 6000);
}
function stopLiveRefresh(){ if(state.liveTimer){ clearInterval(state.liveTimer); state.liveTimer=null; } }


let plantasStarted = false;
function plantasStart(){
  if(!plantasStarted){ setupPhotoDelegation(); plantasStarted = true; }
  loadSitiosDB().then(()=>{ if(state.view==='form') render(); });
  render();
}
function plantasStop(){ stopLocationLoop(); stopLiveRefresh(); }
window.PlantasApp = { start: plantasStart, stop: plantasStop };
})();
</script>

<script>
// ===================== EMERGENCIAS / CORRECTIVO =====================
(function(){

const LOC_INTERVAL_MS = 2*60*60*1000;
const PHOTO_MAX_DIM = 480;
const PHOTO_QUALITY = 0.55;

let state = { view:"home", currentSession:null, locTimer:null, liveTimer:null, viewerId:null, viewedSession:null };

function uid(){ return 'OT' + Math.floor(1000000+Math.random()*8999999); }
function rid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowIso(){ return new Date().toISOString(); }
function fmt(dt){ if(!dt) return "—"; const d=new Date(dt); return d.toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'}); }
function isMasterAdmin(){ try{ return localStorage.getItem('masterAdmin')==='1'; }catch(e){ return false; } }
function isAdminOnlyMode(){ try{ return localStorage.getItem('adminActive')==='1' && localStorage.getItem('masterAdmin')!=='1'; }catch(e){ return false; } }
function hasAdminAccess(){ return isAdminOnlyMode() || isMasterAdmin(); }

function emptySession(otId){
  return {
    id: otId && otId.trim() ? otId.trim() : uid(),
    createdAt: nowIso(), updatedAt: nowIso(), status: "en_progreso",
    general: {
      nombreEstacion:"", categoria:"", regional:"", responsable:"", departamento:"", noInc:"",
      direccion:"", noTas:"", tipoEstacion:"", fechaEjecucion:nowIso(), tipoSitio:"", fechaFin:"",
      siteOwner:""
    },
    actividad: {
      tipoActividad:"", tipoEquipoFalla:"", subsistema:"", modelo:"",
      afectacionServicios:"", reinstalacion:"", cambio:"", reparacion:""
    },
    descripcionFalla:"", descripcionSolucion:"",
    repuestosRetirados:[], repuestosInstalados:[],
    materiales:[], evidencias:[],
    hallazgoSi:"", hallazgosObservaciones:"", hallazgosFotos:[], hallazgos:[],
    transporte:[],
    fallaResuelta:"", observaciones:"",
    firma:{ejecuta:"",empresa:"INMEL",revisa:"",fechaElaboracion:""},
    ubicaciones:[],
    videos:[]
  };
}
const ROW_TEMPLATES = {
  repuestosRetirados: ()=>({id:rid(),descripcion:"",marca:"",modelo:"",serial:""}),
  repuestosInstalados: ()=>({id:rid(),descripcion:"",marca:"",modelo:"",serial:""}),
  materiales: ()=>({id:rid(),cantidad:"",unidad:"",descripcion:"",fotoAntes:null,fotoDespues:null}),
  evidencias: ()=>({id:rid(),caption:"",foto:null}),
  hallazgos: ()=>({id:rid(),sistema:"",prioridad:"Media",descripcion:"",resuelto:"",foto:null}),
  hallazgosFotos: ()=>({id:rid(),foto:null}),
  transporte: ()=>({id:rid(),distanciaKm:"",tiempo:"",tipo:"",observacion:"",foto:null}),
};

// ---------- STORAGE ----------
async function saveSession(sess){
  sess.updatedAt = nowIso();
  await window.storage.set('emergencias-session:'+sess.id, JSON.stringify(sess), true);
  await updateIndex(sess);
}
async function saveSessionSafe(sess){
  try{ await saveSession(sess); return true; }catch(e){ console.error(e); return false; }
}
async function loadSession(id){
  try{ const r = await window.storage.get('emergencias-session:'+id, true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; }
}
async function updateIndex(sess){
  const summary = {id:sess.id, tipo:'emergencias', nombreEstacion:sess.general.nombreEstacion||"(sin nombre)", status:sess.status, createdAt:sess.createdAt, updatedAt:sess.updatedAt};
  try{ await window.storage.set('emergencias-index-entry:'+sess.id, JSON.stringify(summary), true); }catch(e){ console.error(e); }
}
async function getIndex(){
  try{
    const listing = await window.storage.list('emergencias-index-entry:', true);
    const keys = (listing && listing.keys) || [];
    const entries = await Promise.all(keys.map(async (k)=>{
      try{ const r = await window.storage.get(k, true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; }
    }));
    return entries.filter(Boolean);
  }catch(e){ return []; }
}
async function deleteSessionEverywhere(id){
  try{
    const sess = await loadSession(id);
    if(sess && sess.videos && sess.videos.length){
      for(const v of sess.videos){ await deleteVideoData(id, v.id); }
    }
  }catch(e){}
  try{ await window.storage.delete('emergencias-session:'+id, true); }catch(e){}
  try{ await window.storage.delete('emergencias-index-entry:'+id, true); }catch(e){}
}

// ---------- videos (guardados aparte, no dentro del JSON de la sesión) ----------
const VIDEO_MAX_MB = 20;
async function saveVideoData(sessId, videoId, dataUrl){
  await window.storage.set('emergencias-video-data:'+sessId+':'+videoId, dataUrl, true);
}
async function loadVideoData(sessId, videoId){
  try{ const r = await window.storage.get('emergencias-video-data:'+sessId+':'+videoId, true); return r ? r.value : null; }catch(e){ return null; }
}
async function deleteVideoData(sessId, videoId){
  try{ await window.storage.delete('emergencias-video-data:'+sessId+':'+videoId, true); }catch(e){}
}

// ---------- GEOLOCATION ----------
function captureLocation(sess, tipo){
  if(!navigator.geolocation){
    sess.ubicaciones.push({lat:null,lng:null,timestamp:nowIso(),tipo,error:"Geolocalización no disponible en este navegador"});
    saveSessionSafe(sess); if(state.currentSession===sess) render();
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    sess.ubicaciones.push({lat:pos.coords.latitude,lng:pos.coords.longitude,timestamp:nowIso(),tipo});
    await saveSessionSafe(sess);
    if(state.currentSession===sess) render();
  }, async (err)=>{
    sess.ubicaciones.push({lat:null,lng:null,timestamp:nowIso(),tipo,error:err.message||"Permiso de ubicación denegado"});
    await saveSessionSafe(sess);
    if(state.currentSession===sess) render();
  }, {enableHighAccuracy:true, timeout:15000});
}
function startLocationLoop(sess){
  stopLocationLoop();
  captureLocation(sess,"inicial");
  state.locTimer = setInterval(()=>{
    if(state.currentSession && state.currentSession.status==="en_progreso"){ captureLocation(state.currentSession,"periodica"); }
  }, LOC_INTERVAL_MS);
}
function stopLocationLoop(){ if(state.locTimer){ clearInterval(state.locTimer); state.locTimer=null; } }
function mapLink(lat,lng){ return `https://www.google.com/maps?q=${lat},${lng}`; }

function activeSession(){ return state.view==='viewsession' ? state.viewedSession : state.currentSession; }
function findRow(arrName, rowId){ const s=activeSession(); if(!s) return null; return (s[arrName]||[]).find(r=>r.id===rowId); }

// ---------- photo capture / compression ----------
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>=h){ if(w>PHOTO_MAX_DIM){ h = Math.round(h*PHOTO_MAX_DIM/w); w = PHOTO_MAX_DIM; } }
        else { if(h>PHOTO_MAX_DIM){ w = Math.round(w*PHOTO_MAX_DIM/h); h = PHOTO_MAX_DIM; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', PHOTO_QUALITY));
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}
// photo key format: arrName|rowId|field
function photoCellHtml(key, dataUrl, readonly, label){
  const lbl = label || 'Evidencia';
  if(dataUrl){
    return `<div class="foto-col-title">${lbl}</div><div class="photo-thumb-wrap">
      <img src="${dataUrl}" class="photo-thumb" data-enlarge="${key}">
      ${!readonly?`<button type="button" class="photo-del" data-delphoto="${key}" title="Eliminar foto">✕</button>`:''}
    </div>`;
  }
  if(readonly) return `<div class="foto-col-title">${lbl}</div><span class="no-photo">— sin foto —</span>`;
  return `<div class="foto-col-title">${lbl}</div><div class="photo-box">
    <button type="button" class="photo-btn" data-cam="${key}" title="Tomar foto con la cámara">📷</button>
    <button type="button" class="photo-btn" data-gal="${key}" title="Elegir de galería">🖼️</button>
    <input type="file" accept="image/*" class="photo-input" data-key="${key}" style="display:none;">
  </div>`;
}

// ---------- RENDER ----------
function topbar(activeView){
  return `
  <div class="topbar">
    <div class="brand">
      <div class="mark">C·I</div>
      <div><div class="title">Claro · INMEL — O&amp;M</div><div class="sub">Mant. Correctivo y Emergencias</div></div>
    </div>
    <div class="nav">
      <button data-nav="home" class="${activeView==='home'?'active':''}">Inicio</button>
      <button data-nav="historial" class="${activeView==='historial'?'active':''}">Historial</button>
      ${hasAdminAccess()?`<button data-nav="supervisor" class="${activeView==='supervisor'?'active':''}">Supervisor</button>`:''}
    </div>
  </div>`;
}

async function render(){
  const app = document.getElementById('emergencias-app');
  if(state.view==="home") app.innerHTML = topbar('home') + renderHome();
  else if(state.view==="nuevo") app.innerHTML = topbar('') + renderNuevo();
  else if(state.view==="historial") app.innerHTML = topbar('historial') + await renderHistorialAsync();
  else if(state.view==="supervisor") app.innerHTML = topbar('supervisor') + await renderSupervisorAsync();
  else if(state.view==="form") app.innerHTML = topbar('') + renderForm(state.currentSession,false);
  else if(state.view==="viewsession") app.innerHTML = topbar('') + renderForm(state.viewedSession,true);
  else if(state.view==="finalizado") app.innerHTML = topbar('') + renderFinalizado();
  attachHandlers();
}

function renderHome(){
  return `
  <div class="home-grid">
    ${isAdminOnlyMode()?`<div class="card" style="grid-column:1/-1;"><p class="hint" style="margin:0;">Como administrador puedes ver el historial y el modo supervisor, pero no crear nuevas atenciones ni borrar formatos.</p></div>`:`
    <div class="home-card" data-nav="nuevo" data-tipo="Emergencia">
      <div class="icon">🚨</div><h3>Nueva Emergencia</h3>
      <p>Ingresa el número de OT y registra la atención de emergencia en campo. Para Correctivos, usa la tarjeta correspondiente en el panel principal.</p>
    </div>`}
    <div class="home-card" data-nav="historial">
      <div class="icon">🗂️</div><h3>Historial</h3>
      <p>Ver o descargar (PDF) los reportes guardados.</p>
    </div>
    ${hasAdminAccess()?`<div class="home-card" data-nav="supervisor">
      <div class="icon">📡</div><h3>Modo supervisor</h3>
      <p>Ver en línea una atención en curso y revisar sus evidencias.</p>
    </div>`:''}
  </div>
  <div class="card" style="margin-top:14px;">
    <h2>Cómo funciona</h2>
    <p style="font-size:12.5px;color:var(--muted);line-height:1.5;margin:0;">
      Cualquier cantidad de técnicos puede atender emergencias en paralelo, en distintos sitios, cada uno con su
      propia OT. El supervisor puede revisar en "Modo supervisor" cualquier atención en curso o finalizada.
    </p>
  </div>`;
}

function renderNuevo(){
  const suggested = uid();
  return `<div class="card">
    <h2>Nueva atención${state.pendingTipo?(' — '+state.pendingTipo):''} — Número de OT</h2>
    <div class="field"><label>Número de Orden de Trabajo (OT)</label>
      <input id="ot-input" placeholder="Ej: OT5309583" value="${suggested}">
    </div>
    <p style="font-size:12px;color:var(--muted);">Puedes dejar el número sugerido o escribir el número real de tu OT.</p>
    <div class="row-actions">
      <button class="btn" id="btn-crear-ot">🚨 Crear e iniciar atención</button>
      <button class="btn ghost" id="btn-volver">← Cancelar</button>
    </div>
  </div>`;
}

async function renderHistorialAsync(){
  const idx = await getIndex();
  if(idx.length===0) return `<div class="card"><div class="empty">Aún no hay reportes guardados.</div></div>`;
  idx.sort((a,b)=> new Date(b.updatedAt)-new Date(a.updatedAt));
  return `<div class="card"><h2>Historial de atenciones</h2>
    <div class="hist-list">
      ${idx.map(s=>`
        <div class="hist-row">
          <div class="main" data-open="${s.id}">
            <div class="id">${s.id}</div>
            <div class="name">${s.nombreEstacion} · actualizado ${fmt(s.updatedAt)}</div>
          </div>
          <span class="status-pill ${s.status}">${s.status==='en_progreso'?'En progreso':'Finalizado'}</span>
          <div class="hist-actions">
            <button class="btn secondary small" data-pdf="${s.id}">⬇️ PDF</button>
            
            ${isMasterAdmin()?`<button class="btn danger small" data-delete="${s.id}">🗑️ Borrar</button>`:''}
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

async function renderSupervisorAsync(){
  const idx = await getIndex();
  const enProgreso = idx.filter(s=>s.status==='en_progreso');
  let html = `<div class="card"><h2>Ver atención en vivo</h2>`;
  if(enProgreso.length===0){ html += `<div class="empty">No hay atenciones en progreso en este momento.</div></div>`; return html; }
  html += `<div class="hist-list">
    ${enProgreso.map(s=>`
      <div class="hist-row">

function textField(labelTxt, path, value, readonly){
  return `<div class="field"><label>${labelTxt}</label><input data-field="${path}" value="${(value||'').toString().replace(/"/g,'&quot;')}" ${readonly?'disabled':''}></div>`;
}
function dateField(labelTxt, path, value, readonly){
  return `<div class="field"><label>${labelTxt}</label><input type="datetime-local" data-field="${path}" data-iso="1" value="${value? new Date(value).toISOString().slice(0,16):''}" ${readonly?'disabled':''}></div>`;
}
function textareaField(labelTxt, path, value, readonly){
  return `<div class="field"><label>${labelTxt}</label><textarea data-field="${path}" ${readonly?'disabled':''}>${value||''}</textarea></div>`;
}
function siNoField(labelTxt, path, value, readonly){
  return `<div class="field"><label>${labelTxt}</label><select data-field="${path}" ${readonly?'disabled':''}>
    <option value="" ${value===''?'selected':''}>Seleccione</option>
    <option value="SI" ${value==='SI'?'selected':''}>SÍ</option>
    <option value="NO" ${value==='NO'?'selected':''}>NO</option>
  </select></div>`;
}
function selectField(labelTxt, path, value, options, readonly){
  return `<div class="field"><label>${labelTxt}</label><select data-field="${path}" ${readonly?'disabled':''}>
    <option value="" ${!value?'selected':''}>Seleccione</option>
    ${options.map(o=>`<option value="${o}" ${value===o?'selected':''}>${o}</option>`).join('')}
  </select></div>`;
}

function renderLocationPanel(sess, readonly){
  const lastLoc = sess.ubicaciones.length ? sess.ubicaciones[sess.ubicaciones.length-1] : null;
  const log = sess.ubicaciones.slice().reverse().map(u=>{
    if(u.lat) return `<div>📍 <a href="${mapLink(u.lat,u.lng)}" target="_blank">${u.lat.toFixed(5)}, ${u.lng.toFixed(5)}</a> — ${fmt(u.timestamp)} <i>(${u.tipo})</i></div>`;
    return `<div>⚠️ Error de ubicación (${u.tipo}) — ${fmt(u.timestamp)}: ${u.error||''}</div>`;
  }).join('') || '<div style="color:var(--muted);">Aún no hay registros de ubicación.</div>';
  let actions = '';
  if(!readonly){
    actions = `<div class="row-actions" style="margin-top:8px;">
      <button class="btn secondary small" id="btn-gps-auto">📍 Generar ubicación GPS ahora</button>
    </div>
    <div class="manual-loc">
      <div class="field"><label>Latitud (manual)</label><input id="manual-lat" placeholder="Ej: 8.31234"></div>
      <div class="field"><label>Longitud (manual)</label><input id="manual-lng" placeholder="Ej: -75.4023"></div>
      <button class="btn ghost small" id="btn-gps-manual">➕ Pegar ubicación manual</button>
    </div>`;
  }
  return `<div class="card"><h2>📍 Ubicación GPS</h2>
    <div class="loc-panel">
      <div>Última ubicación: ${lastLoc ? (lastLoc.lat? `<a href="${mapLink(lastLoc.lat,lastLoc.lng)}" target="_blank">${lastLoc.lat.toFixed(5)}, ${lastLoc.lng.toFixed(5)}</a> (${fmt(lastLoc.timestamp)}, ${lastLoc.tipo})` : `error — ${fmt(lastLoc.timestamp)}`) : 'aún sin registrar'}</div>
      ${actions}
      <div class="loc-log">${log}</div>
    </div>
  </div>`;
}
